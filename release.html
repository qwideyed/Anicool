<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniCool - Airing Schedule & Releases</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AniCool" />
  <meta property="og:title" content="AniCool - Airing Schedule & Releases" />
  <meta property="og:description" content="Track anime episode broadcast schedules and live countdowns in your local timezone with zero ads." />
  <meta property="og:image" content="favicon.png" />
  <meta name="theme-color" content="#ff2a74" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0b10;
      --bubble-bg: rgba(20, 22, 32, 0.88);
      --bubble-border: rgba(255, 255, 255, 0.1);
      --card-bg: rgba(255, 255, 255, 0.035);
      --accent-pink: #ff2a74;
      --accent-purple: #9d5cf6;
      --accent-blue: #00d2ff;
      --discord-color: #5865F2;
      --donate-color: #f43f5e;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(157, 92, 246, 0.1) 0%, transparent 40%);
    }

    /* Header Nav */
    .header-wrapper {
      position: sticky;
      top: 16px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
    }

    .bubble-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: fit-content;
      min-width: 0;
      padding: 5px 20px;
      background: var(--bubble-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .logo a {
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      display: inline-block;
      letter-spacing: 0.5px;
      transition: transform 0.25s ease;
    }

    .logo a:hover {
      transform: scale(1.05);
    }

    .logo span {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      list-style: none;
      align-items: center;
      gap: 6px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 9999px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    /* Outside Companion Buttons */
    .outside-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .outside-bubble-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 44px;
      padding: 0 16px;
      background: var(--bubble-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transition: all 0.25s ease;
      cursor: pointer;
      white-space: nowrap;
    }

    .outside-bubble-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .outside-bubble-btn.discord-btn:hover {
      background: rgba(88, 101, 242, 0.2);
      border-color: var(--discord-color);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(88, 101, 242, 0.35);
    }

    .outside-bubble-btn.donate-btn:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--donate-color);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(244, 63, 94, 0.35);
    }

    /* Main Container */
    .main-content {
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px 24px 80px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Seasonal Status Quick Bar */
    .season-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(20, 22, 32, 0.6);
      border: 1px solid var(--bubble-border);
      border-radius: 18px;
      padding: 10px 20px;
      font-size: 0.82rem;
      color: var(--text-dim);
      flex-wrap: wrap;
      gap: 12px;
    }

    .season-info-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .season-pill-badge {
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid rgba(0, 210, 255, 0.35);
      color: var(--accent-blue);
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .tz-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Controls Bubble Card */
    .schedule-control-card {
      background: var(--card-bg);
      border: 1px solid var(--bubble-border);
      border-radius: 26px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      backdrop-filter: blur(24px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .days-pill-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .days-pill-group::-webkit-scrollbar {
      display: none;
    }

    .day-pill-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--bubble-border);
      border-radius: 18px;
      color: var(--text-dim);
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      min-width: 90px;
    }

    .day-pill-btn .pill-day-name {
      font-size: 0.82rem;
      font-weight: 700;
    }

    .day-pill-btn .pill-day-date {
      font-size: 0.72rem;
      opacity: 0.75;
      margin-top: 2px;
    }

    .day-pill-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #fff;
    }

    .day-pill-btn.active {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(255, 42, 116, 0.4);
    }

    .filter-options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .filters-left-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-filter-bar {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      padding: 3px;
      gap: 3px;
    }

    .pill-filter-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 9999px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .pill-filter-btn:hover {
      color: #fff;
    }

    .pill-filter-btn.active {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .watchlist-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--bubble-border);
      color: var(--text-dim);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .watchlist-toggle-btn.active {
      background: rgba(234, 179, 8, 0.18);
      border-color: #eab308;
      color: #facc15;
    }

    .view-toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .schedule-search-input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      padding: 6px 14px;
      width: 200px;
    }

    .schedule-search-input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.84rem;
      font-family: inherit;
      width: 100%;
    }

    /* Daily Grid View */
    .schedule-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 16px;
    }

    /* Kanban Board View (7 Columns side-by-side) */
    .kanban-board-container {
      display: grid;
      grid-template-columns: repeat(7, minmax(240px, 1fr));
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .kanban-column {
      background: rgba(20, 22, 32, 0.5);
      border: 1px solid var(--bubble-border);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 500px;
    }

    .kanban-col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--bubble-border);
      padding-bottom: 8px;
    }

    .kanban-col-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
    }

    .kanban-col-count {
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    /* Schedule Card */
    .schedule-entry-card {
      background: var(--card-bg);
      border: 1px solid var(--bubble-border);
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
      backdrop-filter: blur(16px);
      transition: all 0.2s ease;
      position: relative;
    }

    .schedule-entry-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    }

    .entry-thumb-box {
      position: relative;
      width: 58px;
      height: 78px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      background: #141624;
    }

    .entry-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .entry-meta-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .entry-top-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .airing-time-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(0, 210, 255, 0.15);
      border: 1px solid rgba(0, 210, 255, 0.35);
      color: var(--accent-blue);
      white-space: nowrap;
    }

    .countdown-timer-pill {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 9999px;
      white-space: nowrap;
      font-family: monospace;
    }

    .timer-upcoming {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #10b981;
    }

    .timer-just-aired {
      background: rgba(234, 179, 8, 0.2);
      border: 1px solid rgba(234, 179, 8, 0.4);
      color: #facc15;
      animation: pulse-glow 1.5s infinite;
    }

    @keyframes pulse-glow {
      0% { opacity: 0.8; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }

    .timer-aired {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-dim);
    }

    .entry-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-sub-info {
      font-size: 0.72rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Episode Progress Bar */
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 2px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
      border-radius: 9999px;
    }

    /* Interactive Action Icons (Favorite & Calendar) */
    .card-actions-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .action-icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .action-icon-btn.is-fav {
      color: #facc15;
    }

    .skeleton {
      animation: skeleton-pulse 1.5s infinite ease-in-out;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.04) 75%);
      background-size: 200% 100%;
    }

    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 960px) {
      .header-wrapper {
        flex-wrap: wrap;
      }
      .bubble-nav {
        width: 100%;
      }
      .filter-options-row {
        flex-direction: column;
        align-items: stretch;
      }
      .schedule-search-input-box {
        width: 100%;
      }
      .schedule-grid-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Header Nav -->
  <div class="header-wrapper">
    <header class="bubble-nav">
      <div class="logo">
        <a href="index.html">Ani<span>Cool</span></a>
      </div>

      <nav>
        <ul class="nav-links">
          <li class="nav-item">
            <a href="index.html" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a href="release.html" class="nav-link active">Release</a>
          </li>
          <li class="nav-item">
            <a href="genre.html" class="nav-link">Genre</a>
          </li>
          <li class="nav-item">
            <a href="websites.html" class="nav-link">Websites</a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="outside-btn-group">
      <a href="https://discord.com/invite/tDny2ubsCx" target="_blank" rel="noopener" class="outside-bubble-btn discord-btn" title="Join our Discord">
        <svg viewBox="0 0 127.14 96.36">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.86,53,48.81,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
        </svg>
        <span>Discord</span>
      </a>

      <a href="donate.html" class="outside-bubble-btn donate-btn" title="Support AniCool">
        <span class="material-symbols-outlined" style="color: var(--donate-color); font-size: 18px;">favorite</span>
        <span>Donate</span>
      </a>
    </div>
  </div>

  <main class="main-content">

    <!-- Seasonal Info Bar -->
    <div class="season-status-bar">
      <div class="season-info-left">
        <span class="season-pill-badge" id="currentSeasonLabel">Fall 2026 Cycle</span>
        <span id="weeklyEpisodeCount">Calculating broadcast totals...</span>
      </div>
      <div class="tz-indicator">
        <span class="material-symbols-outlined" style="font-size: 16px;">public</span>
        <span id="tzLabel">Timezone: Local</span>
      </div>
    </div>

    <!-- Controls Bubble Card -->
    <section class="schedule-control-card">
      <div class="days-pill-group" id="daysPillGroup"></div>

      <div class="filter-options-row">
        <div class="filters-left-wrap">
          <!-- Status Filters -->
          <div class="pill-filter-bar">
            <button type="button" class="pill-filter-btn active" onclick="setStatusFilter('ALL', this)">All</button>
            <button type="button" class="pill-filter-btn" onclick="setStatusFilter('UPCOMING', this)">Upcoming</button>
            <button type="button" class="pill-filter-btn" onclick="setStatusFilter('AIRED', this)">Aired</button>
          </div>

          <!-- Format Filters -->
          <div class="pill-filter-bar">
            <button type="button" class="pill-filter-btn active" onclick="setFormatFilter('ALL', this)">All Formats</button>
            <button type="button" class="pill-filter-btn" onclick="setFormatFilter('TV', this)">TV</button>
            <button type="button" class="pill-filter-btn" onclick="setFormatFilter('MOVIE', this)">Movie</button>
            <button type="button" class="pill-filter-btn" onclick="setFormatFilter('ONA', this)">ONA / OVA</button>
          </div>

          <!-- Origin Filters -->
          <div class="pill-filter-bar">
            <button type="button" class="pill-filter-btn active" onclick="setCountryFilter('ALL', this)">All Origins</button>
            <button type="button" class="pill-filter-btn" onclick="setCountryFilter('JP', this)">JP (Anime)</button>
            <button type="button" class="pill-filter-btn" onclick="setCountryFilter('CN', this)">CN (Donghua)</button>
          </div>

          <!-- Watchlist Only Pinning -->
          <button type="button" class="watchlist-toggle-btn" id="watchlistToggleBtn" onclick="toggleWatchlistOnly()">
            <span class="material-symbols-outlined" style="font-size: 16px;">star</span> Watchlist Only
          </button>
        </div>

        <div class="view-toggle-wrap">
          <!-- View Switcher (Daily Grid vs. Weekly Kanban) -->
          <div class="pill-filter-bar">
            <button type="button" class="pill-filter-btn active" id="dailyViewBtn" onclick="switchView('daily')">Daily Grid</button>
            <button type="button" class="pill-filter-btn" id="kanbanViewBtn" onclick="switchView('kanban')">Weekly Board</button>
          </div>

          <div class="schedule-search-input-box">
            <span class="material-symbols-outlined" style="font-size: 17px; color: #64748b;">search</span>
            <input type="text" id="scheduleSearch" placeholder="Find series..." autocomplete="off" />
          </div>
        </div>
      </div>
    </section>

    <!-- Main Output View (Daily Grid or Kanban Board) -->
    <div id="scheduleOutput">
      <section class="schedule-grid-container" id="scheduleGrid"></section>
    </div>

  </main>

  <script>
    const DAYS_MAP = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    let selectedDayIndex = new Date().getDay();
    let currentScheduleList = [];
    let weekKanbanCache = {};

    let currentStatusFilter = 'ALL';
    let currentFormatFilter = 'ALL';
    let currentCountryFilter = 'ALL';
    let isWatchlistOnly = false;
    let searchQuery = '';
    let currentView = 'daily';

    let countdownInterval = null;

    // Detect Local Timezone
    try {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      document.getElementById('tzLabel').textContent = `Timezone: ${tz}`;
    } catch(e) {}

    // Season Detection
    function detectSeason() {
      const month = new Date().getMonth() + 1;
      const year = new Date().getFullYear();
      let season = "Winter";
      if (month >= 3 && month <= 5) season = "Spring";
      else if (month >= 6 && month <= 8) season = "Summer";
      else if (month >= 9 && month <= 11) season = "Fall";
      document.getElementById('currentSeasonLabel').textContent = `${season} ${year} Cycle`;
    }

    // Initialize 7-Day Day Selector Bar
    function initDaysBar() {
      const container = document.getElementById("daysPillGroup");
      const today = new Date();
      const currentDay = today.getDay();

      let html = "";
      for (let i = 0; i < 7; i++) {
        const offset = i - currentDay;
        const d = new Date();
        d.setDate(today.getDate() + offset);

        const dayName = DAYS_MAP[i];
        const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
        const isToday = i === currentDay;

        html += `
          <button type="button" class="day-pill-btn ${i === selectedDayIndex ? 'active' : ''}" onclick="selectDay(${i}, this)">
            <span class="pill-day-name">${dayName} ${isToday ? '★' : ''}</span>
            <span class="pill-day-date">${dateStr}</span>
          </button>
        `;
      }
      container.innerHTML = html;
    }

    function selectDay(dayIndex, btn) {
      document.querySelectorAll(".day-pill-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedDayIndex = dayIndex;
      if (currentView === 'daily') {
        fetchDaySchedule(dayIndex);
      }
    }

    // Filter Handlers
    function setStatusFilter(status, btn) {
      btn.parentElement.querySelectorAll('.pill-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStatusFilter = status;
      renderActiveView();
    }

    function setFormatFilter(format, btn) {
      btn.parentElement.querySelectorAll('.pill-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFormatFilter = format;
      renderActiveView();
    }

    function setCountryFilter(country, btn) {
      btn.parentElement.querySelectorAll('.pill-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCountryFilter = country;
      renderActiveView();
    }

    function toggleWatchlistOnly() {
      isWatchlistOnly = !isWatchlistOnly;
      document.getElementById('watchlistToggleBtn').classList.toggle('active', isWatchlistOnly);
      renderActiveView();
    }

    // View Switching (Daily vs Kanban)
    function switchView(view) {
      currentView = view;
      document.getElementById('dailyViewBtn').classList.toggle('active', view === 'daily');
      document.getElementById('kanbanViewBtn').classList.toggle('active', view === 'kanban');

      if (view === 'daily') {
        fetchDaySchedule(selectedDayIndex);
      } else {
        fetchWeeklyKanban();
      }
    }

    // Watchlist Favorite Helpers (LocalStorage)
    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem('anicool_watchlist') || '[]');
      } catch(e) { return []; }
    }

    function toggleFavorite(id, e) {
      e.preventDefault();
      e.stopPropagation();
      let favs = getFavorites();
      if (favs.includes(id)) {
        favs = favs.filter(item => item !== id);
      } else {
        favs.push(id);
      }
      localStorage.setItem('anicool_watchlist', JSON.stringify(favs));
      renderActiveView();
    }

    // Google Calendar Event Link Creator
    function openGoogleCalendar(title, epNum, airUnix, e) {
      e.preventDefault();
      e.stopPropagation();

      const startDate = new Date(airUnix * 1000);
      const endDate = new Date((airUnix + 1800) * 1000); // 30 mins later

      const formatTime = (d) => d.toISOString().replace(/-|:|\.\d\d\d/g, "");
      const dates = `${formatTime(startDate)}/${formatTime(endDate)}`;

      const text = encodeURIComponent(`${title} - Episode ${epNum}`);
      const details = encodeURIComponent(`Streaming episode release for ${title} Episode ${epNum}. Local Airing Time.`);
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${dates}&details=${details}`;

      window.open(url, '_blank');
    }

    // Fetch Day Schedule from AniList GraphQL
    async function fetchDaySchedule(dayIndex) {
      const output = document.getElementById("scheduleOutput");
      output.innerHTML = `<section class="schedule-grid-container" id="scheduleGrid"></section>`;
      const grid = document.getElementById("scheduleGrid");

      grid.innerHTML = Array(9).fill(`
        <div class="schedule-entry-card skeleton" style="min-height: 104px;"></div>
      `).join("");

      const now = new Date();
      const offset = dayIndex - now.getDay();
      const targetDate = new Date();
      targetDate.setDate(now.getDate() + offset);
      targetDate.setHours(0, 0, 0, 0);

      const startUnix = Math.floor(targetDate.getTime() / 1000);
      const endUnix = startUnix + 86400;

      const query = `
        query ($start: Int, $end: Int) {
          Page(page: 1, perPage: 50) {
            airingSchedules(airingAt_greater: $start, airingAt_lesser: $end, sort: TIME) {
              id
              airingAt
              episode
              media {
                id
                countryOfOrigin
                episodes
                format
                title { english romaji native }
                coverImage { medium }
                averageScore
              }
            }
          }
        }
      `;

      try {
        const res = await fetch("https://graphql.anilist.co", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, variables: { start: startUnix, end: endUnix } })
        });
        const json = await res.json();
        currentScheduleList = json?.data?.Page?.airingSchedules || [];
        renderDailyGrid();
      } catch (err) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-dim); padding: 30px;">Failed to load airing data.</p>`;
      }
    }

    // Weekly Kanban Fetch (All 7 Days)
    async function fetchWeeklyKanban() {
      const output = document.getElementById("scheduleOutput");
      output.innerHTML = `<div class="kanban-board-container" id="kanbanBoard"></div>`;
      const board = document.getElementById("kanbanBoard");

      board.innerHTML = DAYS_MAP.map(day => `
        <div class="kanban-column">
          <div class="kanban-col-head">
            <span class="kanban-col-title">${day}</span>
            <span class="kanban-col-count">Loading...</span>
          </div>
          <div class="schedule-entry-card skeleton" style="min-height: 90px;"></div>
          <div class="schedule-entry-card skeleton" style="min-height: 90px;"></div>
        </div>
      `).join('');

      const now = new Date();
      const currentDay = now.getDay();
      const sundayDate = new Date();
      sundayDate.setDate(now.getDate() - currentDay);
      sundayDate.setHours(0, 0, 0, 0);

      const weekStart = Math.floor(sundayDate.getTime() / 1000);
      const weekEnd = weekStart + (7 * 86400);

      const query = `
        query ($start: Int, $end: Int) {
          Page(page: 1, perPage: 50) {
            airingSchedules(airingAt_greater: $start, airingAt_lesser: $end, sort: TIME) {
              id
              airingAt
              episode
              media {
                id
                countryOfOrigin
                episodes
                format
                title { english romaji native }
                coverImage { medium }
                averageScore
              }
            }
          }
        }
      `;

      try {
        const res = await fetch("https://graphql.anilist.co", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, variables: { start: weekStart, end: weekEnd } })
        });
        const json = await res.json();
        const allSlots = json?.data?.Page?.airingSchedules || [];

        document.getElementById('weeklyEpisodeCount').textContent = `${allSlots.length} Total Episodes Airing This Week`;

        weekKanbanCache = {};
        for (let i = 0; i < 7; i++) weekKanbanCache[i] = [];

        allSlots.forEach(slot => {
          const slotDay = new Date(slot.airingAt * 1000).getDay();
          if (weekKanbanCache[slotDay]) weekKanbanCache[slotDay].push(slot);
        });

        renderKanbanBoard();
      } catch (e) {
        board.innerHTML = `<p style="padding: 20px; color: var(--text-dim);">Failed to load weekly calendar.</p>`;
      }
    }

    // Filtering logic helper
    function applySlotFilters(slots) {
      const nowUnix = Math.floor(Date.now() / 1000);
      const favs = getFavorites();

      return slots.filter(slot => {
        const isUpcoming = slot.airingAt > nowUnix;
        if (currentStatusFilter === 'UPCOMING' && !isUpcoming) return false;
        if (currentStatusFilter === 'AIRED' && isUpcoming) return false;

        const fmt = slot.media.format || '';
        if (currentFormatFilter === 'TV' && fmt !== 'TV' && fmt !== 'TV_SHORT') return false;
        if (currentFormatFilter === 'MOVIE' && fmt !== 'MOVIE') return false;
        if (currentFormatFilter === 'ONA' && fmt !== 'ONA' && fmt !== 'OVA') return false;

        const country = slot.media.countryOfOrigin || 'JP';
        if (currentCountryFilter !== 'ALL' && country !== currentCountryFilter) return false;

        if (isWatchlistOnly && !favs.includes(slot.media.id)) return false;

        if (searchQuery) {
          const t1 = (slot.media.title.english || '').toLowerCase();
          const t2 = (slot.media.title.romaji || '').toLowerCase();
          if (!t1.includes(searchQuery) && !t2.includes(searchQuery)) return false;
        }

        return true;
      });
    }

    function renderActiveView() {
      if (currentView === 'daily') renderDailyGrid();
      else renderKanbanBoard();
    }

    // Render Daily View
    function renderDailyGrid() {
      const grid = document.getElementById("scheduleGrid");
      if (!grid) return;

      const filtered = applySlotFilters(currentScheduleList);

      if (!filtered.length) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-dim); padding: 40px;">No broadcast entries match this filter.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(slot => createCardHtml(slot)).join("");
      startCountdownTimers();
    }

    // Render Kanban View
    function renderKanbanBoard() {
      const board = document.getElementById("kanbanBoard");
      if (!board) return;

      board.innerHTML = DAYS_MAP.map((day, dayIdx) => {
        const slotsForDay = applySlotFilters(weekKanbanCache[dayIdx] || []);
        const cardsHtml = slotsForDay.length 
          ? slotsForDay.map(slot => createCardHtml(slot)).join("")
          : `<p style="font-size: 0.78rem; color: var(--text-dim); padding: 12px 0;">No releases</p>`;

        return `
          <div class="kanban-column">
            <div class="kanban-col-head">
              <span class="kanban-col-title">${day}</span>
              <span class="kanban-col-count">${slotsForDay.length} eps</span>
            </div>
            ${cardsHtml}
          </div>
        `;
      }).join('');

      startCountdownTimers();
    }

    // HTML Generator for a Single Schedule Card
    function createCardHtml(slot) {
      const media = slot.media;
      const title = media.title.english || media.title.romaji;
      const timeStr = new Date(slot.airingAt * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const favs = getFavorites();
      const isFav = favs.includes(media.id);

      const totalEps = media.episodes || null;
      let progressHtml = '';
      if (totalEps) {
        const percent = Math.min(100, Math.round((slot.episode / totalEps) * 100));
        progressHtml = `
          <div class="progress-bar-wrap" title="${percent}% of season released">
            <div class="progress-bar-fill" style="width: ${percent}%;"></div>
          </div>
        `;
      }

      return `
        <a href="entry.html?id=${media.id}" class="schedule-entry-card" data-airing-at="${slot.airingAt}">
          <div class="entry-thumb-box">
            <img src="${media.coverImage?.medium || ''}" alt="${title}" class="entry-thumb" loading="lazy" />
          </div>
          <div class="entry-meta-col">
            <div class="entry-top-line">
              <span class="airing-time-pill">
                <span class="material-symbols-outlined" style="font-size: 13px;">alarm</span>
                ${timeStr}
              </span>
              <span class="countdown-timer-pill timer-upcoming" data-air-time="${slot.airingAt}">--:--:--</span>
            </div>
            <h3 class="entry-title" title="${title}">${title}</h3>
            <div class="entry-sub-info">
              <span>Ep ${slot.episode}${totalEps ? ` / ${totalEps}` : ''}</span>
              <span>•</span>
              <span>${media.format || 'TV'}</span>
            </div>
            ${progressHtml}
          </div>

          <div class="card-actions-group">
            <button type="button" class="action-icon-btn ${isFav ? 'is-fav' : ''}" title="${isFav ? 'Remove from Watchlist' : 'Add to Watchlist'}" onclick="toggleFavorite(${media.id}, event)">
              <span class="material-symbols-outlined" style="font-size: 18px;">${isFav ? 'star' : 'star_border'}</span>
            </button>
            <button type="button" class="action-icon-btn" title="Add to Google Calendar" onclick="openGoogleCalendar('${escapeHtml(title)}', ${slot.episode}, ${slot.airingAt}, event)">
              <span class="material-symbols-outlined" style="font-size: 17px;">event</span>
            </button>
          </div>
        </a>
      `;
    }

    // Live Ticking Countdown Clock Handler
    function startCountdownTimers() {
      clearInterval(countdownInterval);

      function updateTimers() {
        const now = Math.floor(Date.now() / 1000);
        document.querySelectorAll('.countdown-timer-pill').forEach(pill => {
          const airTime = parseInt(pill.dataset.airTime, 10);
          if (!airTime) return;

          const diff = airTime - now;

          if (diff <= 0 && diff > -3600) {
            pill.textContent = "JUST AIRED";
            pill.className = "countdown-timer-pill timer-just-aired";
          } else if (diff <= -3600) {
            pill.textContent = "Aired";
            pill.className = "countdown-timer-pill timer-aired";
          } else {
            const h = Math.floor(diff / 3600);
            const m = Math.floor((diff % 3600) / 60);
            const s = diff % 60;

            const pad = (n) => n.toString().padStart(2, '0');
            pill.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
            pill.className = "countdown-timer-pill timer-upcoming";
          }
        });
      }

      updateTimers();
      countdownInterval = setInterval(updateTimers, 1000);
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    document.getElementById("scheduleSearch").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderActiveView();
    });

    window.addEventListener("DOMContentLoaded", () => {
      detectSeason();
      initDaysBar();
      fetchDaySchedule(selectedDayIndex);
    });
  </script>

</body>
</html>
