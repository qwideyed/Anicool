<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniCool - Estimated Airing Schedule</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AniCool" />
  <meta property="og:title" content="AniCool - Estimated Airing Schedule" />
  <meta property="og:description" content="Track anime episode broadcast schedules and live countdowns in your local timezone with zero ads." />
  <meta property="og:image" content="favicon.png" />
  <meta name="theme-color" content="#ff2a74" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0b10;
      --bubble-bg: rgba(20, 22, 32, 0.88);
      --bubble-border: rgba(255, 255, 255, 0.1);
      --card-bg: rgba(255, 255, 255, 0.035);
      --accent-pink: #ff2a74;
      --accent-purple: #9d5cf6;
      --accent-blue: #00d2ff;
      --discord-color: #5865F2;
      --donate-color: #f43f5e;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(157, 92, 246, 0.1) 0%, transparent 40%);
    }

    /* Header Nav */
    .header-wrapper {
      position: sticky;
      top: 16px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
    }

    .bubble-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: fit-content;
      min-width: 0;
      padding: 5px 20px;
      background: var(--bubble-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .logo a {
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      display: inline-block;
      letter-spacing: 0.5px;
      transition: transform 0.25s ease;
    }

    .logo a:hover {
      transform: scale(1.05);
    }

    .logo span {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      list-style: none;
      align-items: center;
      gap: 6px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 9999px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    /* Outside Companion Buttons */
    .outside-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .outside-bubble-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 44px;
      padding: 0 16px;
      background: var(--bubble-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transition: all 0.25s ease;
      cursor: pointer;
      white-space: nowrap;
    }

    .outside-bubble-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .outside-bubble-btn.discord-btn:hover {
      background: rgba(88, 101, 242, 0.2);
      border-color: var(--discord-color);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(88, 101, 242, 0.35);
    }

    .outside-bubble-btn.donate-btn:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--donate-color);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(244, 63, 94, 0.35);
    }

    .donate-icon {
      color: var(--donate-color);
      font-size: 18px;
    }

    /* Main Container */
    .main-content {
      max-width: 1380px;
      margin: 0 auto;
      padding: 24px 24px 80px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Hero Section */
    .schedule-hero {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 10px 10px 0;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid rgba(0, 210, 255, 0.35);
      color: var(--accent-blue);
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hero-title {
      font-size: 2.3rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }

    .hero-title span {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtext {
      max-width: 640px;
      font-size: 0.92rem;
      color: var(--text-dim);
      line-height: 1.6;
    }

    /* Bubble Control Bar (Days & Search) */
    .schedule-control-card {
      background: var(--card-bg);
      border: 1px solid var(--bubble-border);
      border-radius: 26px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      backdrop-filter: blur(24px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .control-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .days-pill-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .days-pill-group::-webkit-scrollbar {
      display: none;
    }

    .day-pill-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--bubble-border);
      border-radius: 18px;
      color: var(--text-dim);
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      min-width: 90px;
    }

    .day-pill-btn .pill-day-name {
      font-size: 0.82rem;
      font-weight: 700;
    }

    .day-pill-btn .pill-day-date {
      font-size: 0.72rem;
      opacity: 0.75;
      margin-top: 2px;
    }

    .day-pill-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #fff;
    }

    .day-pill-btn.active {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(255, 42, 116, 0.4);
    }

    .filter-search-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-filter-pills {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      padding: 3px;
      gap: 4px;
    }

    .status-pill-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 9999px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .status-pill-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .schedule-search-input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      padding: 6px 14px;
      width: 220px;
    }

    .schedule-search-input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.84rem;
      font-family: inherit;
      width: 100%;
    }

    /* Release Grid */
    .schedule-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .schedule-entry-card {
      background: var(--card-bg);
      border: 1px solid var(--bubble-border);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: #fff;
      backdrop-filter: blur(16px);
      transition: all 0.25s ease;
      position: relative;
    }

    .schedule-entry-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .entry-thumb-box {
      position: relative;
      width: 60px;
      height: 80px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      background: #141624;
    }

    .entry-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .entry-meta-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .entry-top-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .airing-time-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(0, 210, 255, 0.15);
      border: 1px solid rgba(0, 210, 255, 0.35);
      color: var(--accent-blue);
    }

    .airing-countdown-pill {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
    }

    .badge-upcoming {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #10b981;
    }

    .badge-aired {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
    }

    .entry-title {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-sub-info {
      font-size: 0.76rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .skeleton {
      animation: skeleton-pulse 1.5s infinite ease-in-out;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.04) 75%);
      background-size: 200% 100%;
    }

    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 860px) {
      .header-wrapper {
        flex-wrap: wrap;
      }
      .bubble-nav {
        width: 100%;
      }
      .hero-title {
        font-size: 1.8rem;
      }
      .control-top-row {
        flex-direction: column;
        align-items: stretch;
      }
      .schedule-search-input-box {
        width: 100%;
      }
      .schedule-grid-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Header Nav -->
  <div class="header-wrapper">
    <header class="bubble-nav">
      <div class="logo">
        <a href="index.html">Ani<span>Cool</span></a>
      </div>

      <nav>
        <ul class="nav-links">
          <li class="nav-item">
            <a href="index.html" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a href="release.html" class="nav-link active">Release</a>
          </li>
          <li class="nav-item">
            <a href="genre.html" class="nav-link">Genre</a>
          </li>
          <li class="nav-item">
            <a href="websites.html" class="nav-link">Websites</a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="outside-btn-group">
      <a href="https://discord.com/invite/tDny2ubsCx" target="_blank" rel="noopener" class="outside-bubble-btn discord-btn" title="Join our Discord">
        <svg viewBox="0 0 127.14 96.36">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.86,53,48.81,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
        </svg>
        <span>Discord</span>

      <a href="donate.html" class="outside-bubble-btn donate-btn" title="Support AniCool">
        <span class="material-symbols-outlined donate-icon">favorite</span>
        <span>Donate</span>
      </a>
    </div>
  </div>

  <main class="main-content">

    <!-- Hero Title -->
    <section class="schedule-hero">
      <div class="hero-badge">
        <span class="material-symbols-outlined" style="font-size: 15px;">schedule</span>
        Live Broadcasts
      </div>
      <h1 class="hero-title">Weekly <span>Airing</span> Schedule</h1>
      <p class="hero-subtext">
        Track episode broadcast times and countdowns synchronized to your local timezone.
      </p>
    </section>

    <!-- Controls Bubble Card -->
    <section class="schedule-control-card">
      <div class="days-pill-group" id="daysPillGroup">
        <!-- Mon - Sun Days populated by JavaScript -->
      </div>

      <div class="control-top-row">
        <div class="status-filter-pills">
          <button type="button" class="status-pill-btn active" onclick="filterStatus('ALL', this)">All Episodes</button>
          <button type="button" class="status-pill-btn" onclick="filterStatus('UPCOMING', this)">Upcoming</button>
          <button type="button" class="status-pill-btn" onclick="filterStatus('AIRED', this)">Already Aired</button>
        </div>

        <div class="schedule-search-input-box">
          <span class="material-symbols-outlined" style="font-size: 18px; color: #64748b;">search</span>
          <input type="text" id="scheduleSearch" placeholder="Search series..." autocomplete="off" />
        </div>
      </div>
    </section>

    <!-- Schedule Grid -->
    <section class="schedule-grid-container" id="scheduleGrid">
      <!-- Cards rendered here -->
    </section>

  </main>

  <script>
    const DAYS_MAP = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    let selectedDayIndex = new Date().getDay();
    let currentScheduleList = [];
    let currentStatusFilter = 'ALL';
    let searchQuery = '';

    // Initialize 7-Day Buttons
    function initDaysBar() {
      const container = document.getElementById("daysPillGroup");
      const today = new Date();
      const currentDay = today.getDay();

      let html = "";
      for (let i = 0; i < 7; i++) {
        const offset = i - currentDay;
        const d = new Date();
        d.setDate(today.getDate() + offset);

        const dayName = DAYS_MAP[i];
        const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
        const isToday = i === currentDay;

        html += `
          <button type="button" class="day-pill-btn ${i === selectedDayIndex ? 'active' : ''}" onclick="selectDay(${i}, this)">
            <span class="pill-day-name">${dayName} ${isToday ? '★' : ''}</span>
            <span class="pill-day-date">${dateStr}</span>
          </button>
        `;
      }
      container.innerHTML = html;
    }

    function selectDay(dayIndex, btn) {
      document.querySelectorAll(".day-pill-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedDayIndex = dayIndex;
      fetchDaySchedule(dayIndex);
    }

    function filterStatus(status, btn) {
      document.querySelectorAll(".status-pill-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentStatusFilter = status;
      renderSchedule();
    }

    async function fetchDaySchedule(dayIndex) {
      const grid = document.getElementById("scheduleGrid");
      grid.innerHTML = Array(12).fill(`
        <div class="schedule-entry-card skeleton" style="min-height: 104px;"></div>
      `).join("");

      const now = new Date();
      const offset = dayIndex - now.getDay();
      const targetDate = new Date();
      targetDate.setDate(now.getDate() + offset);
      targetDate.setHours(0, 0, 0, 0);

      const startUnix = Math.floor(targetDate.getTime() / 1000);
      const endUnix = startUnix + 86400;

      const query = `
        query ($start: Int, $end: Int) {
          Page(page: 1, perPage: 50) {
            airingSchedules(airingAt_greater: $start, airingAt_lesser: $end, sort: TIME) {
              id
              airingAt
              episode
              timeUntilAiring
              media {
                id
                title { english romaji native }
                coverImage { medium }
                format
                genres
                averageScore
              }
            }
          }
        }
      `;

      try {
        const res = await fetch("https://graphql.anilist.co", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, variables: { start: startUnix, end: endUnix } })
        });
        const json = await res.json();
        currentScheduleList = json?.data?.Page?.airingSchedules || [];
        renderSchedule();
      } catch (err) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-dim); padding: 30px;">Failed to load airing data.</p>`;
      }
    }

    function renderSchedule() {
      const grid = document.getElementById("scheduleGrid");
      const nowUnix = Math.floor(Date.now() / 1000);

      const filtered = currentScheduleList.filter(item => {
        const isUpcoming = item.airingAt > nowUnix;
        if (currentStatusFilter === 'UPCOMING' && !isUpcoming) return false;
        if (currentStatusFilter === 'AIRED' && isUpcoming) return false;

        if (searchQuery) {
          const t1 = (item.media.title.english || '').toLowerCase();
          const t2 = (item.media.title.romaji || '').toLowerCase();
          if (!t1.includes(searchQuery) && !t2.includes(searchQuery)) return false;
        }

        return true;
      });

      if (!filtered.length) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-dim); padding: 40px;">No broadcast entries match this filter.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(slot => {
        const media = slot.media;
        const title = media.title.english || media.title.romaji;
        const timeStr = new Date(slot.airingAt * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const isUpcoming = slot.airingAt > nowUnix;

        let badgeHtml = '';
        if (isUpcoming) {
          const diffSec = slot.airingAt - nowUnix;
          const hours = Math.floor(diffSec / 3600);
          const mins = Math.floor((diffSec % 3600) / 60);
          badgeHtml = `<span class="airing-countdown-pill badge-upcoming">in ${hours}h ${mins}m</span>`;
        } else {
          badgeHtml = `<span class="airing-countdown-pill badge-aired">Aired</span>`;
        }

        const score = media.averageScore ? `★ ${media.averageScore}%` : '';

        return `
          <a href="entry.html?id=${media.id}" class="schedule-entry-card">
            <div class="entry-thumb-box">
              <img src="${media.coverImage?.medium || ''}" alt="${title}" class="entry-thumb" loading="lazy" />
            </div>
            <div class="entry-meta-col">
              <div class="entry-top-line">
                <span class="airing-time-pill">
                  <span class="material-symbols-outlined" style="font-size: 13px;">alarm</span>
                  ${timeStr}
                </span>
                ${badgeHtml}
              </div>
              <h3 class="entry-title" title="${title}">${title}</h3>
              <div class="entry-sub-info">
                <span>Ep ${slot.episode}</span>
                <span>•</span>
                <span>${media.format || 'TV'}</span>
                ${score ? `<span>•</span><span style="color:#10b981; font-weight:600;">${score}</span>` : ''}
              </div>
            </div>
          </a>
        `;
      }).join("");
    }

    document.getElementById("scheduleSearch").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderSchedule();
    });

    window.addEventListener("DOMContentLoaded", () => {
      initDaysBar();
      fetchDaySchedule(selectedDayIndex);
    });
  </script>

</body>
</html>
