<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniRealm - Modern Bubble UI</title>

  <!-- Google Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Google Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    /* ================= RESET & ROOT ================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0b0c10;
      --bubble-bg: rgba(22, 24, 34, 0.75);
      --bubble-border: rgba(255, 255, 255, 0.1);
      --accent-pink: #ff2a74;
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-dim: #9ca3af;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 150vh;
      background-image: 
        radial-gradient(circle at 20% 15%, rgba(255, 42, 116, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 80% 25%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
    }

    /* ================= FLOATING HEADER ================= */
    .header-wrapper {
      position: sticky;
      top: 20px;
      z-index: 1000;
      display: flex;
      justify-content: center;
      padding: 0 20px;
    }

    .bubble-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1100px;
      padding: 10px 24px;
      background: var(--bubble-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }

    /* Logo */
    .logo a {
      font-size: 1.35rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .logo a:hover {
      transform: scale(1.05);
    }

    .logo span {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Navigation Links */
    .nav-links {
      display: flex;
      list-style: none;
      align-items: center;
      gap: 10px;
    }

    .nav-item {
      position: static; /* Allows mega-menu to center under header */
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 9999px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .arrow-down {
      font-size: 0.7rem;
      transition: transform 0.25s ease;
    }

    .hub-dropdown:hover .arrow-down {
      transform: rotate(180deg);
    }

    /* ================= HORIZONTAL MEGA MENU ================= */
    .hub-dropdown {
      position: relative;
    }

    .mega-menu {
      position: absolute;
      top: calc(100% + 18px);
      left: 50%;
      transform: translateX(-50%) translateY(14px) scale(0.97);
      width: 780px;
      background: rgba(18, 20, 28, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--bubble-border);
      border-radius: 28px;
      padding: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    /* Hover trigger */
    .hub-dropdown:hover .mega-menu {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Cards Inside Mega Menu */
    .hub-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.25s ease;
    }

    .hub-card:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-anime { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge-manga { background: rgba(139, 92, 246, 0.2); color: #c084fc; }
    .badge-hentai { background: rgba(255, 42, 116, 0.2); color: #ff5e97; }

    .card-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-links a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.88rem;
      padding: 6px 10px;
      border-radius: 10px;
      display: block;
      transition: all 0.2s ease;
    }

    .card-links a:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      padding-left: 14px;
    }

    /* ================= SEARCH ICON BUBBLE ================= */
    .search-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--bubble-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .search-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-pink);
      transform: scale(1.08);
      box-shadow: 0 0 15px rgba(255, 42, 116, 0.35);
    }

    /* ================= SEARCH MODAL POPUP ================= */
    .search-modal {
      position: fixed;
      inset: 0;
      background: rgba(7, 8, 12, 0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 15vh;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      z-index: 2000;
    }

    .search-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .search-box-popup {
      position: relative;
      width: 90%;
      max-width: 620px;
      background: rgba(24, 26, 36, 0.95);
      border: 1px solid var(--bubble-border);
      border-radius: 24px;
      padding: 16px 22px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      transform: translateY(-20px) scale(0.95);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .search-modal.active .search-box-popup {
      transform: translateY(0) scale(1);
    }

    .search-box-popup .material-symbols-outlined {
      color: var(--accent-pink);
      font-size: 26px;
    }

    .search-box-popup input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1.15rem;
      font-family: inherit;
    }

    .search-box-popup input::placeholder {
      color: #63677b;
    }

    .close-search-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .close-search-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Mobile adjustments */
    @media (max-width: 860px) {
      .mega-menu {
        width: calc(100vw - 40px);
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Header Wrapper -->
  <div class="header-wrapper">
    <header class="bubble-nav">
      
      <!-- Logo -->
      <div class="logo">
        <a href="#">Ani<span>Realm</span></a>
      </div>

      <!-- Navigation Links -->
      <nav>
        <ul class="nav-links">
          <li class="nav-item">
            <a href="#home" class="nav-link active">Home</a>
          </li>

          <!-- HUB Dropdown With Horizontal Cards -->
          <li class="nav-item hub-dropdown">
            <a href="javascript:void(0)" class="nav-link">
              Hub <span class="arrow-down">▼</span>
            </a>
            
            <!-- Horizontal Mega Menu -->
            <div class="mega-menu">
              <!-- Anime Card -->
              <div class="hub-card">
                <div class="card-header">
                  <span class="card-title">Anime</span>
                  <span class="badge badge-anime">Series</span>
                </div>
                <ul class="card-links">
                  <li><a href="#anime-popular">Popular</a></li>
                  <li><a href="#anime-genre">Genre</a></li>
                  <li><a href="#anime-newly-released">Newly Released</a></li>
                  <li><a href="#anime-coming-out">Coming Out</a></li>
                </ul>
              </div>

              <!-- Manga Card -->
              <div class="hub-card">
                <div class="card-header">
                  <span class="card-title">Manga</span>
                  <span class="badge badge-manga">Read</span>
                </div>
                <ul class="card-links">
                  <li><a href="#manga-popular">Popular</a></li>
                  <li><a href="#manga-genre">Genre</a></li>
                  <li><a href="#manga-newly-released">Newly Released</a></li>
                  <li><a href="#manga-coming-out">Coming Out</a></li>
                </ul>
              </div>

              <!-- Hentai Card -->
              <div class="hub-card">
                <div class="card-header">
                  <span class="card-title">Hentai</span>
                  <span class="badge badge-hentai">18+</span>
                </div>
                <ul class="card-links">
                  <li><a href="#hentai-popular">Popular</a></li>
                  <li><a href="#hentai-genre">Genre</a></li>
                  <li><a href="#hentai-newly-released">Newly Released</a></li>
                  <li><a href="#hentai-coming-out">Coming Out</a></li>
                </ul>
              </div>
            </div>
          </li>

          <li class="nav-item">
            <a href="#mylist" class="nav-link">My List</a>
          </li>
          
          <li class="nav-item">
            <a href="#websites" class="nav-link">Websites</a>
          </li>
        </ul>
      </nav>

      <!-- Google Material Symbols Search Button -->
      <div class="actions">
        <button type="button" class="search-btn" id="openSearchBtn" aria-label="Open Search">
          <span class="material-symbols-outlined">search</span>
        </button>
      </div>

    </header>
  </div>

  <!-- Fullscreen Glass Search Popup Modal -->
  <div class="search-modal" id="searchModal">
    <div class="search-box-popup">
      <span class="material-symbols-outlined">search</span>
      <input type="text" id="searchInput" placeholder="Search anime, manga, characters..." autocomplete="off" />
      <button type="button" class="close-search-btn" id="closeSearchBtn" aria-label="Close Search">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
  </div>

  <!-- Search Modal Script -->
  <script>
    const searchModal = document.getElementById('searchModal');
    const openSearchBtn = document.getElementById('openSearchBtn');
    const closeSearchBtn = document.getElementById('closeSearchBtn');
    const searchInput = document.getElementById('searchInput');

    // Open Search Popup
    openSearchBtn.addEventListener('click', () => {
      searchModal.classList.add('active');
      setTimeout(() => searchInput.focus(), 100);
    });

    // Close on Click Button
    closeSearchBtn.addEventListener('click', () => {
      searchModal.classList.remove('active');
    });

    // Close on Outside Click
    searchModal.addEventListener('click', (e) => {
      if (e.target === searchModal) {
        searchModal.classList.remove('active');
      }
    });

    // Close on Escape Key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && searchModal.classList.contains('active')) {
        searchModal.classList.remove('active');
      }
    });
  </script>

</body>
</html>
