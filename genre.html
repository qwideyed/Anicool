<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniCool</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0b10;
      --bubble-bg: rgba(20, 22, 32, 0.85);
      --bubble-border: rgba(255, 255, 255, 0.1);
      --card-bg: rgba(255, 255, 255, 0.035);
      --accent-pink: #ff2a74;
      --accent-purple: #9d5cf6;
      --accent-blue: #00d2ff;
      --discord-color: #5865F2;
      --donate-color: #f43f5e;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;

      /* Filter Theme */
      --filter-btn-bg: #111b2b;
      --filter-menu-bg: #0d1726;
      --filter-border: #1a273b;
      --filter-check-border: #2c3e59;
      --filter-text: #9ab0d1;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 42, 116, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(157, 92, 246, 0.1) 0%, transparent 40%);
    }

    /* Outer Wrapper for Header + Outside Buttons */
    .header-wrapper {
      position: sticky;
      top: 16px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
    }

    /* Slim, Clean Nav Bar (No Hub, No Search) */
    .bubble-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: fit-content;
      padding: 5px 22px;
      background: var(--bubble-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .logo a {
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      display: inline-block;
      letter-spacing: 0.5px;
      transition: transform 0.25s ease;
    }

    .logo a:hover {
      transform: scale(1.05);
    }

    .logo span {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      list-style: none;
      align-items: center;
      gap: 6px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 9999px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    /* Outside Companion Buttons (Discord & Donate) */
    .outside-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .outside-bubble-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 44px;
      padding: 0 16px;
      background: var(--bubble-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transition: all 0.25s ease;
      cursor: pointer;
      white-space: nowrap;
    }

    .outside-bubble-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .outside-bubble-btn.discord-btn {
      color: #cbd5e1;
    }

    .outside-bubble-btn.discord-btn:hover {
      background: rgba(88, 101, 242, 0.2);
      border-color: var(--discord-color);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(88, 101, 242, 0.35);
    }

    .outside-bubble-btn.donate-btn {
      color: #cbd5e1;
    }

    .outside-bubble-btn.donate-btn:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--donate-color);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(244, 63, 94, 0.35);
    }

    .donate-icon {
      color: var(--donate-color);
      font-size: 18px;
    }

    /* Main Content */
    .main-content {
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px 30px 80px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Filter Section */
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-main-heading {
      font-size: 1.85rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    /* 5-Column Grid */
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .filter-input {
      width: 100%;
      height: 42px;
      background: var(--filter-btn-bg);
      border: 1px solid var(--filter-border);
      border-radius: 6px;
      padding: 0 14px;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .filter-input:focus {
      border-color: #0284c7;
    }

    .filter-input::placeholder {
      color: #556277;
    }

    /* Dropdown Trigger Widget */
    .cb-dropdown {
      position: relative;
      width: 100%;
    }

    .cb-dropdown-btn {
      width: 100%;
      height: 42px;
      background: var(--filter-btn-bg);
      border: 1px solid var(--filter-border);
      border-radius: 6px;
      padding: 0 14px;
      color: #cbd5e1;
      font-size: 0.84rem;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cb-dropdown-btn:hover {
      background: #152236;
      border-color: #283a54;
    }

    .cb-dropdown.active .cb-dropdown-btn {
      border-color: #0284c7;
      color: #fff;
    }

    .cb-dropdown-btn .badge-counter {
      background: var(--accent-pink);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 9999px;
      display: none;
      margin-left: auto;
    }

    /* 4-Column Mega Dropdown Menu */
    .cb-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 720px;
      max-height: 380px;
      overflow-y: auto;
      background: var(--filter-menu-bg);
      border: 1px solid var(--filter-border);
      border-radius: 8px;
      padding: 14px 16px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.85);
      z-index: 600;
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px 14px;
    }

    .cb-menu.compact-menu {
      width: 440px;
      grid-template-columns: repeat(2, 1fr);
    }

    .cb-dropdown.align-right .cb-menu {
      left: auto;
      right: 0;
    }

    .cb-dropdown.active .cb-menu {
      display: grid;
    }

    .cb-menu::-webkit-scrollbar {
      width: 5px;
    }

    .cb-menu::-webkit-scrollbar-thumb {
      background: #1f3047;
      border-radius: 4px;
    }

    .cb-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
      color: var(--filter-text);
      font-size: 0.8rem;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s;
    }

    .cb-item:hover {
      color: #fff;
    }

    .cb-item input[type="checkbox"],
    .cb-item input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 3px;
      background: #152236;
      border: 1px solid var(--filter-check-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .cb-item input[type="radio"] {
      border-radius: 50%;
    }

    .cb-item input[type="checkbox"]:checked,
    .cb-item input[type="radio"]:checked {
      background: #0284c7;
      border-color: #0284c7;
    }

    .cb-item input[type="checkbox"]:checked::after {
      content: '✓';
      color: #fff;
      font-size: 10px;
      font-weight: 700;
    }

    .cb-item input[type="radio"]:checked::after {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
    }

    /* Bottom Action Bar */
    .filter-bottom-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .filter-bottom-bar .cb-dropdown {
      width: 220px;
    }

    .anikoto-submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 42px;
      padding: 0 24px;
      background: #0ea5e9;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s;
    }

    .anikoto-submit-btn:hover {
      background: #0284c7;
      transform: translateY(-1px);
    }

    .reset-link-btn {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.84rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 14px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .reset-link-btn:hover {
      color: #cbd5e1;
    }

    /* Active Summary Header */
    .catalog-summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 16px;
    }

    .summary-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .summary-subtext {
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    /* Cards Grid */
    .anime-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card-wrap {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .card-wrap:hover {
      z-index: 100;
    }

    .anime-card {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--bubble-border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
    }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.42;
      overflow: hidden;
      background: #141622;
      flex-shrink: 0;
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-badge-top {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 17, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #10b981;
    }

    .card-format-tag {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(255, 42, 116, 0.85);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .card-info {
      padding: 12px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      justify-content: space-between;
    }

    .card-item-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-item-sub {
      font-size: 0.78rem;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
    }

    /* Hover Bubble */
    .card-hover-bubble {
      position: absolute;
      top: 0;
      left: calc(100% + 12px);
      width: 320px;
      background: rgba(16, 18, 26, 0.98);
      backdrop-filter: blur(24px);
      border: 1px solid var(--bubble-border);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: translateX(-6px) scale(0.97);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-wrap:hover .card-hover-bubble {
      opacity: 1;
      visibility: visible;
      transform: translateX(0) scale(1);
    }

    .card-wrap.align-left .card-hover-bubble {
      left: auto;
      right: calc(100% + 12px);
      transform: translateX(6px) scale(0.97);
    }

    .hover-bubble-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .hover-bubble-meta {
      display: flex;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .hover-bubble-desc {
      font-size: 0.8rem;
      line-height: 1.5;
      color: #94a3b8;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hover-bubble-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hover-tag {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 0.7rem;
      color: #cbd5e1;
    }

    .infinite-scroll-sentinel {
      width: 100%;
      padding: 30px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
    }

    .loading-spinner {
      display: inline-block;
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .skeleton {
      animation: skeleton-pulse 1.5s infinite ease-in-out;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.04) 75%);
      background-size: 200% 100%;
    }

    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 1100px) {
      .filter-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .cb-menu {
        width: 580px;
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 720px) {
      .header-wrapper {
        flex-wrap: wrap;
      }
      .bubble-nav {
        width: 100%;
        justify-content: space-between;
      }
      .filter-grid {
        grid-template-columns: 1fr;
      }
      .cb-menu {
        width: 100%;
        grid-template-columns: repeat(2, 1fr);
      }
      .filter-bottom-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .filter-bottom-bar .cb-dropdown {
        width: 100%;
      }
      .anime-cards-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 16px;
      }
      .card-hover-bubble {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="header-wrapper">

    <header class="bubble-nav">
      <div class="logo">
        <a href="index.html">Ani<span>Cool</span></a>

  </div>

    <!-- Anikoto-Style 5-Column Grid with 4-Column Horizontal Dropdown Panels -->

  <script>
    let activeFilters = {
      search: "",
      category: ["ANIME"],
      genres: [],
      years: [],
      seasons: [],
      formats: [],
      statuses: [],
      countries: [],
      ratings: [],
      sources: [],
      excludes: [],
      sort: "POPULARITY_DESC"
    };

    let currentPage = 1;
    let hasNextPage = true;
    let isLoading = false;
    let currentLang = "EN";

    // Custom Dropdown Open/Close & Multi-Check Logic
    document.querySelectorAll('.cb-dropdown').forEach(dropdown => {
      const btn = dropdown.querySelector('.cb-dropdown-btn');
      
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = dropdown.classList.contains('active');
        document.querySelectorAll('.cb-dropdown').forEach(d => d.classList.remove('active'));
        if (!isOpen) dropdown.classList.add('active');
      });

      dropdown.querySelectorAll('input').forEach(input => {
        input.addEventListener('change', () => {
          updateDropdownBadge(dropdown);
        });
      });
    });

    window.addEventListener('click', () => {
      document.querySelectorAll('.cb-dropdown').forEach(d => d.classList.remove('active'));
    });

    document.querySelectorAll('.cb-menu').forEach(menu => {
      menu.addEventListener('click', (e) => e.stopPropagation());
    });

    function updateDropdownBadge(dropdown) {
      const badge = dropdown.querySelector('.badge-counter');
      const sortLabel = dropdown.querySelector('#sortLabel');
      
      if (dropdown.dataset.single === 'true') {
        const checkedRadio = dropdown.querySelector('input:checked');
        if (checkedRadio && sortLabel) {
          sortLabel.textContent = checkedRadio.parentElement.textContent.trim();
        }
        return;
      }

      const count = dropdown.querySelectorAll('input:checked').length;
      if (badge) {
        if (count > 0) {
          badge.textContent = count;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
      }
    }

    // Read Filter Values
    function readInputs() {
      activeFilters.search = document.getElementById('filterKeyword').value.trim();

      const getChecked = (name) => {
        const dropdown = document.querySelector(`.cb-dropdown[data-filter="${name}"]`);
        if (!dropdown) return [];
        return Array.from(dropdown.querySelectorAll('input:checked')).map(i => i.value);
      };

      activeFilters.category = getChecked('category');
      if (activeFilters.category.length === 0) activeFilters.category = ['ANIME'];

      activeFilters.genres = getChecked('genres');
      activeFilters.years = getChecked('years');
      activeFilters.seasons = getChecked('seasons');
      activeFilters.formats = getChecked('formats');
      activeFilters.statuses = getChecked('statuses');
      activeFilters.countries = getChecked('countries');
      activeFilters.ratings = getChecked('ratings');
      activeFilters.sources = getChecked('sources');
      activeFilters.excludes = getChecked('excludes');

      const sortRadio = document.querySelector('.cb-dropdown[data-filter="sort"] input:checked');
      activeFilters.sort = sortRadio ? sortRadio.value : "POPULARITY_DESC";
    }

    function resetFilters() {
      document.getElementById('filterKeyword').value = "";
      
      document.querySelectorAll('.cb-dropdown').forEach(d => {
        d.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
      });

      // Default Category: Anime
      const animeCb = document.querySelector('.cb-dropdown[data-filter="category"] input[value="ANIME"]');
      if (animeCb) animeCb.checked = true;

      // Default Sort: Most Popular
      const popRadio = document.querySelector('.cb-dropdown[data-filter="sort"] input[value="POPULARITY_DESC"]');
      if (popRadio) popRadio.checked = true;

      document.querySelectorAll('.cb-dropdown').forEach(updateDropdownBadge);

      readInputs();
      resetAndFetch();
    }

    document.getElementById('applyFilterBtn').addEventListener('click', () => {
      readInputs();
      resetAndFetch();
    });

    document.getElementById('clearFilterBtn').addEventListener('click', resetFilters);

    document.getElementById('filterKeyword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        readInputs();
        resetAndFetch();
      }
    });

    function updateSummary() {
      const parts = [];
      if (activeFilters.category.length) parts.push(activeFilters.category.join(', '));
      if (activeFilters.genres.length) parts.push(activeFilters.genres.slice(0, 3).join(', ') + (activeFilters.genres.length > 3 ? ` +${activeFilters.genres.length - 3}` : ''));
      if (activeFilters.years.length) parts.push(activeFilters.years.join(', '));
      if (activeFilters.seasons.length) parts.push(activeFilters.seasons.join(', '));
      if (activeFilters.formats.length) parts.push(activeFilters.formats.join(', '));

      const title = activeFilters.search ? `Results for "${activeFilters.search}"` : (parts.length ? parts.join(' • ') : "All Releases");
      document.getElementById('summaryTitle').textContent = title;
      document.getElementById('summarySubtext').textContent = `Showing matched entries`;
    }

    function resetAndFetch() {
      currentPage = 1;
      hasNextPage = true;
      updateSummary();
      const grid = document.getElementById('genreGrid');
      grid.innerHTML = Array(12).fill(`
        <div class="card-wrap">
          <div class="anime-card skeleton" style="min-height: 280px;"></div>
        </div>
      `).join('');
      document.getElementById('infiniteSentinel').style.display = 'flex';
      fetchMedia(false);
    }

    async function fetchMedia(append = false) {
      if (isLoading || (!hasNextPage && append)) return;
      isLoading = true;

      // Categorical Mapping (Anime, Manga, Hentai, Read Hentai, Manhwa, Manhua)
      let resolvedType = 'ANIME';
      let resolvedIsAdult = false;
      let resolvedCountry = undefined;

      const cats = activeFilters.category;
      if (cats.includes('MANGA') || cats.includes('READ_HENTAI') || cats.includes('MANHWA') || cats.includes('MANHUA')) {
        resolvedType = 'MANGA';
      }
      if (cats.includes('HENTAI') || cats.includes('READ_HENTAI')) {
        resolvedIsAdult = true;
      }
      if (cats.includes('MANHWA')) {
        resolvedCountry = 'KR';
      }
      if (cats.includes('MANHUA')) {
        resolvedCountry = 'CN';
      }

      if (activeFilters.countries.length > 0) {
        resolvedCountry = activeFilters.countries[0];
      }

      let varDefs = '$page: Int,$type: MediaType, $sort: [MediaSort],$isAdult: Boolean';
      let mediaFilters = 'type: $type, sort: $sort, isAdult:$isAdult';

      const variables = {
        page: currentPage,
        type: resolvedType,
        isAdult: resolvedIsAdult,
        sort: [activeFilters.sort]
      };

      if (resolvedCountry) {
        varDefs += ', $country: CountryCode';
        mediaFilters += ', countryOfOrigin: $country';
        variables.country = resolvedCountry;
      }

      if (activeFilters.search) {
        varDefs += ', $search: String';
        mediaFilters += ', search: $search';
        variables.search = activeFilters.search;
      }

      const standardGenres = [
        "Action", "Adventure", "Comedy", "Drama", "Ecchi", "Fantasy",
        "Horror", "Mahou Shoujo", "Mecha", "Music", "Mystery",
        "Psychological", "Romance", "Sci-Fi", "Slice of Life", "Sports",
        "Supernatural", "Thriller"
      ];

      const chosenGenres = activeFilters.genres.filter(g => standardGenres.includes(g));
      const chosenTags = activeFilters.genres.filter(g => !standardGenres.includes(g));

      if (chosenGenres.length > 0) {
        varDefs += ', $genres: [String]';
        mediaFilters += ', genre_in: $genres';
        variables.genres = chosenGenres;
      }

      if (chosenTags.length > 0) {
        varDefs += ', $tagIn: [String]';
        mediaFilters += ', tag_in: $tagIn';
        variables.tagIn = chosenTags;
      }

      if (activeFilters.seasons.length > 0) {
        varDefs += ', $season: MediaSeason';
        mediaFilters += ', season: $season';
        variables.season = activeFilters.seasons[0];
      }

      if (activeFilters.years.length > 0) {
        varDefs += ', $seasonYear: Int';
        mediaFilters += ', seasonYear: $seasonYear';
        variables.seasonYear = parseInt(activeFilters.years[0], 10);
      }

      if (activeFilters.formats.length > 0) {
        varDefs += ', $formats: [MediaFormat]';
        mediaFilters += ', format_in: $formats';
        variables.formats = activeFilters.formats;
      }

      if (activeFilters.statuses.length > 0) {
        varDefs += ', $statuses: [MediaStatus]';
        mediaFilters += ', status_in: $statuses';
        variables.statuses = activeFilters.statuses;
      }

      if (activeFilters.sources.length > 0) {
        varDefs += ', $source: MediaSource';
        mediaFilters += ', source: $source';
        variables.source = activeFilters.sources[0];
      }

      if (activeFilters.ratings.length > 0) {
        varDefs += ', $scoreGreater: Int';
        mediaFilters += ', averageScore_greater: $scoreGreater';
        variables.scoreGreater = parseInt(activeFilters.ratings[0], 10);
      }

      if (activeFilters.excludes.length > 0) {
        varDefs += ', $genreNotIn: [String]';
        mediaFilters += ', genre_not_in: $genreNotIn';
        variables.genreNotIn = activeFilters.excludes;
      }

      const query = `
        query (${varDefs}) {
          Page(page: $page, perPage: 18) {
            pageInfo { hasNextPage }
            media(${mediaFilters}) {
              id
              type
              title { english romaji native }
              coverImage { extraLarge large }
              description
              averageScore
              episodes
              chapters
              format
              genres
            }
          }
        }
      `;

      try {
        const res = await fetch('https://graphql.anilist.co', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, variables })
        });

        const json = await res.json();
        const items = json?.data?.Page?.media || [];
        hasNextPage = json?.data?.Page?.pageInfo?.hasNextPage ?? false;

        renderCards(items, append);

        if (!hasNextPage) {
          document.getElementById('infiniteSentinel').style.display = 'none';
        }
      } catch (err) {
        if (!append) {
          document.getElementById('genreGrid').innerHTML = '<p style="color:var(--text-dim); text-align:center; padding:30px; grid-column:1/-1;">Failed to fetch results.</p>';
        }
      } finally {
        isLoading = false;
      }
    }

    function renderCards(items, append) {
      const grid = document.getElementById('genreGrid');
      if (!append && items.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-dim); text-align:center; padding:30px; grid-column:1/-1;">No anime or manga found matching these criteria.</p>';
        return;
      }

      const html = items.map(item => {
        const title = currentLang === 'JP' 
          ? (item.title.native || item.title.romaji) 
          : (item.title.english || item.title.romaji);

        const score = item.averageScore ? `${item.averageScore}%` : 'N/A';
        const count = item.episodes ? `${item.episodes} EP` : (item.chapters ? `${item.chapters} CH` : (item.format || 'Media'));
        const image = item.coverImage?.extraLarge || item.coverImage?.large || '';
        const cleanedDesc = item.description ? item.description.replace(/<[^>]*>?/gm, '') : 'No synopsis provided.';
        const tags = (item.genres || []).slice(0, 3).map(g => `<span class="hover-tag">${g}</span>`).join('');

        return `
          <div class="card-wrap" data-title-en="${escapeHtml(item.title.english || item.title.romaji)}" data-title-jp="${escapeHtml(item.title.native || item.title.romaji)}">
            <a href="entry.html?id=${item.id}" class="anime-card">
              <div class="card-thumb-wrap">
                <img src="${image}" alt="${title}" class="card-thumb" loading="lazy" />
                <div class="card-badge-top">★ ${score}</div>
                <div class="card-format-tag">${item.format || 'TV'}</div>
              </div>
              <div class="card-info">
                <h3 class="card-item-title" title="${title}">${title}</h3>
                <div class="card-item-sub">
                  <span>${count}</span>
                  <span>${item.format || 'MEDIA'}</span>
                </div>
              </div>
            </a>

            <div class="card-hover-bubble">
              <div class="hover-bubble-title">${title}</div>
              <div class="hover-bubble-meta">
                <span style="color: #10b981; font-weight: 600;">★ ${score}</span>
                <span>•</span>
                <span>${item.format || 'TV'}</span>
                <span>•</span>
                <span>${count}</span>
              </div>
              <div class="hover-bubble-tags">${tags}</div>
              <div class="hover-bubble-desc">${cleanedDesc}</div>
            </div>
          </div>
        `;
      }).join('');

      if (append) {
        grid.insertAdjacentHTML('beforeend', html);
      } else {
        grid.innerHTML = html;
      }

      setupCardBubbleRepositioning(grid);
    }

    function setupCardBubbleRepositioning(container) {
      container.querySelectorAll('.card-wrap').forEach(wrap => {
        wrap.addEventListener('mouseenter', () => {
          const rect = wrap.getBoundingClientRect();
          if (window.innerWidth - rect.right < 340) {
            wrap.classList.add('align-left');
          } else {
            wrap.classList.remove('align-left');
          }
        });
      });
    }

    function escapeHtml(text) {
      return text ? text.replace(/"/g, '&quot;').replace(/'/g, '&#39;') : '';
    }

    function refreshTitles() {
      document.querySelectorAll('.card-wrap').forEach(wrap => {
        const titleEl = wrap.querySelector('.card-item-title');
        const bubbleTitleEl = wrap.querySelector('.hover-bubble-title');
        const title = currentLang === 'JP' ? wrap.dataset.titleJp : wrap.dataset.titleEn;
        if (titleEl && title) {
          titleEl.textContent = title;
          titleEl.title = title;
        }
        if (bubbleTitleEl && title) {
          bubbleTitleEl.textContent = title;
        }
      });
    }

    // Infinite Scroll Observer
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !isLoading && hasNextPage) {
        currentPage++;
        fetchMedia(true);
      }
    }, { rootMargin: '400px' });

    observer.observe(document.getElementById('infiniteSentinel'));

    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.cb-dropdown').forEach(updateDropdownBadge);
      readInputs();
      resetAndFetch();
    });
  </script>

</body>
</html>
