<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniCool</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0b10;
      --bubble-bg: rgba(20, 22, 32, 0.85);
      --bubble-border: rgba(255, 255, 255, 0.1);
      --card-bg: rgba(255, 255, 255, 0.035);
      --accent-pink: #ff2a74;
      --accent-purple: #9d5cf6;
      --accent-blue: #00d2ff;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 42, 116, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(157, 92, 246, 0.1) 0%, transparent 40%);
    }

    .header-wrapper {
      position: sticky;
      top: 20px;
      z-index: 1000;
      display: flex;
      justify-content: center;
      padding: 0 20px;
    }

    .bubble-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1280px;
      padding: 8px 24px;
      background: var(--bubble-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .logo a {
      font-size: 1.35rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      display: inline-block;
      letter-spacing: 0.5px;
      transition: transform 0.25s ease;
    }

    .logo a:hover {
      transform: scale(1.05);
    }

    .logo span {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      list-style: none;
      align-items: center;
      gap: 12px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 9999px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .search-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--bubble-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .search-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-pink);
      transform: scale(1.06);
      box-shadow: 0 0 16px rgba(255, 42, 116, 0.35);
    }

    /* Modal */
    .search-modal {
      position: fixed;
      inset: 0;
      background: rgba(7, 8, 12, 0.85);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 8vh;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      z-index: 2000;
    }

    .search-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .search-container {
      width: 90%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box-popup {
      background: rgba(22, 24, 34, 0.95);
      border: 1px solid var(--bubble-border);
      border-radius: 24px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box-popup input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1.05rem;
      font-family: inherit;
    }

    .lang-toggle {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      padding: 2px;
      gap: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .close-search-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .search-results {
      max-height: 440px;
      overflow-y: auto;
      background: rgba(20, 22, 32, 0.95);
      border: 1px solid var(--bubble-border);
      border-radius: 20px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px;
      border-radius: 14px;
      text-decoration: none;
      color: #fff;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s ease;
    }

    .search-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(4px);
    }

    .search-thumb {
      width: 48px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
    }

    /* Main Content */
    .main-content {
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px 30px 80px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Anikoto-Style Filter Bar Section */
    .anikoto-filter-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-main-heading {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .filter-input-wrap,
    .filter-select-wrap {
      position: relative;
      width: 100%;
    }

    .filter-input {
      width: 100%;
      height: 42px;
      background: #0f141f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0 14px;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .filter-input:focus {
      border-color: var(--accent-blue);
      background: #121826;
    }

    .filter-input::placeholder {
      color: #556277;
    }

    .filter-select {
      width: 100%;
      height: 42px;
      background: #0f141f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0 32px 0 14px;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .filter-select:focus,
    .filter-select:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: #121826;
    }

    .filter-select option {
      background: #0d121c;
      color: #fff;
    }

    .select-arrow {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #556277;
      font-size: 18px;
    }

    .filter-bottom-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 2px;
    }

    .filter-bottom-bar .filter-select-wrap {
      max-width: 220px;
    }

    .anikoto-submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      padding: 0 22px;
      background: #0ea5e9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s;
    }

    .anikoto-submit-btn:hover {
      background: #0284c7;
      transform: translateY(-1px);
    }

    .reset-link-btn {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .reset-link-btn:hover {
      color: #cbd5e1;
    }

    /* Active Heading Summary */
    .catalog-summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 18px;
    }

    .summary-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }

    .summary-subtext {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    /* Cards Grid */
    .anime-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card-wrap {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .card-wrap:hover {
      z-index: 100;
    }

    .anime-card {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--bubble-border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
    }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.42;
      overflow: hidden;
      background: #141622;
      flex-shrink: 0;
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-badge-top {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 17, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #10b981;
    }

    .card-format-tag {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(255, 42, 116, 0.85);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .card-info {
      padding: 12px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      justify-content: space-between;
    }

    .card-item-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-item-sub {
      font-size: 0.78rem;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
    }

    /* Hover Bubble */
    .card-hover-bubble {
      position: absolute;
      top: 0;
      left: calc(100% + 12px);
      width: 320px;
      background: rgba(16, 18, 26, 0.98);
      backdrop-filter: blur(24px);
      border: 1px solid var(--bubble-border);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: translateX(-6px) scale(0.97);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-wrap:hover .card-hover-bubble {
      opacity: 1;
      visibility: visible;
      transform: translateX(0) scale(1);
    }

    .card-wrap.align-left .card-hover-bubble {
      left: auto;
      right: calc(100% + 12px);
      transform: translateX(6px) scale(0.97);
    }

    .hover-bubble-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .hover-bubble-meta {
      display: flex;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .hover-bubble-desc {
      font-size: 0.8rem;
      line-height: 1.5;
      color: #94a3b8;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hover-bubble-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hover-tag {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 0.7rem;
      color: #cbd5e1;
    }

    .infinite-scroll-sentinel {
      width: 100%;
      padding: 30px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
    }

    .loading-spinner {
      display: inline-block;
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .skeleton {
      animation: skeleton-pulse 1.5s infinite ease-in-out;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.04) 75%);
      background-size: 200% 100%;
    }

    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 1100px) {
      .filter-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 720px) {
      .filter-grid {
        grid-template-columns: 1fr;
      }
      .filter-bottom-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .filter-bottom-bar .filter-select-wrap {
        max-width: 100%;
      }
      .anime-cards-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 16px;
      }
      .card-hover-bubble {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Nav Header -->
  <div class="header-wrapper">
    <header class="bubble-nav">
      <div class="logo">
        <a href="index.html">Ani<span>Cool</span></a>
      </div>

      <nav>
        <ul class="nav-links">
          <li class="nav-item">
            <a href="index.html" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a href="genre.html" class="nav-link active">Genre</a>
          </li>
          <li class="nav-item">
            <a href="index.html#websites" class="nav-link">Websites</a>
          </li>
        </ul>
      </nav>

      <div class="actions">
        <button type="button" class="search-btn" id="openSearchBtn" aria-label="Open Search">
          <span class="material-symbols-outlined">search</span>
        </button>
      </div>
    </header>
  </div>

  <!-- Search Modal -->
  <div class="search-modal" id="searchModal">
    <div class="search-container">
      <div class="search-box-popup">
        <span class="material-symbols-outlined">search</span>
        <input type="text" id="searchInput" placeholder="Search anime or manga..." autocomplete="off" />
        <div class="lang-toggle">
          <button type="button" class="lang-btn active" id="langEn">EN</button>
          <button type="button" class="lang-btn" id="langJp">JP</button>
        </div>
        <button type="button" class="close-search-btn" id="closeSearchBtn">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="search-results" id="searchResults" style="display: none;"></div>
    </div>
  </div>

  <main class="main-content">
    
    <!-- Anikoto-Style Filter Area -->
    <section class="anikoto-filter-section">
      <h1 class="filter-main-heading">Filter</h1>

      <!-- 2 Rows x 5 Columns Grid -->
      <div class="filter-grid">
        <!-- Row 1: Search -->
        <div class="filter-input-wrap">
          <input type="text" class="filter-input" id="filterKeyword" placeholder="Search..." autocomplete="off" />
        </div>

        <!-- Row 1: Genre -->
        <div class="filter-select-wrap">
          <select class="filter-select" id="filterGenre">
            <option value="">Select genre</option>
            <option value="Action">Action</option>
            <option value="Adventure">Adventure</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Ecchi">Ecchi</option>
            <option value="Fantasy">Fantasy</option>
            <option value="Horror">Horror</option>
            <option value="Mahou Shoujo">Mahou Shoujo</option>
            <option value="Mecha">Mecha</option>
            <option value="Music">Music</option>
            <option value="Mystery">Mystery</option>
            <option value="Psychological">Psychological</option>
            <option value="Romance">Romance</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Slice of Life">Slice of Life</option>
            <option value="Sports">Sports</option>
            <option value="Supernatural">Supernatural</option>
            <option value="Thriller">Thriller</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>

        <!-- Row 1: Season -->
        <div class="filter-select-wrap">
          <select class="filter-select" id="filterSeason">
            <option value="">Select season</option>
            <option value="WINTER">Winter</option>
            <option value="SPRING">Spring</option>
            <option value="SUMMER">Summer</option>
            <option value="FALL">Fall</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>

        <!-- Row 1: Year -->
        <div class="filter-select-wrap">
          <select class="filter-select" id="filterYear">
            <option value="">Select year</option>
            <option value="2027">2027</option>
            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <option value="2020">2020</option>
            <option value="2019">2019</option>
            <option value="2018">2018</option>
            <option value="2017">2017</option>
            <option value="2016">2016</option>
            <option value="2015">2015</option>
            <option value="2010">2010</option>
            <option value="2005">2005</option>
            <option value="2000">2000</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>

        <!-- Row 1: Type (Anime / Manga) -->
        <div class="filter-select-wrap">
          <select class="filter-select" id="filterType">
            <option value="ANIME">Anime</option>
            <option value="MANGA">Manga</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>

        <!-- Row 2: Format -->
        <div class="filter-select-wrap">
          <select class="filter-select" id="filterFormat">
            <option value="">Select format</option>
            <option value="TV">TV</option>
            <option value="MOVIE">Movie</option>
            <option value="OVA">OVA</option>
            <option value="ONA">ONA</option>
            <option value="SPECIAL">Special</option>
            <option value="TV_SHORT">TV Short</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>

        <!-- Row 2: Status -->
        <div class="filter-select-wrap">
          <select class="filter-select" id="filterStatus">
            <option value="">Select status</option>
            <option value="RELEASING">Currently Airing</option>
            <option value="FINISHED">Finished</option>
            <option value="NOT_YET_RELEASED">Not Yet Aired</option>
            <option value="CANCELLED">Cancelled</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>

        <!-- Row 2: Country / Language Origin -->
        <div class="filter-select-wrap">
          <select class="filter-select" id="filterCountry">
            <option value="">Select language</option>
            <option value="JP">Japanese</option>
            <option value="KR">Korean (Manhwa/Aeni)</option>
            <option value="CN">Chinese (Manhua/Donghua)</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>

        <!-- Row 2: Rating / Score Threshold -->
        <div class="filter-select-wrap">
          <select class="filter-select" id="filterRating">
            <option value="">Select rating</option>
            <option value="90">90%+ Score</option>
            <option value="80">80%+ Score</option>
            <option value="70">70%+ Score</option>
            <option value="60">60%+ Score</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>

        <!-- Row 2: Source -->
        <div class="filter-select-wrap">
          <select class="filter-select" id="filterSource">
            <option value="">Select source</option>
            <option value="MANGA">Manga</option>
            <option value="LIGHT_NOVEL">Light Novel</option>
            <option value="ORIGINAL">Original</option>
            <option value="VISUAL_NOVEL">Visual Novel</option>
            <option value="VIDEO_GAME">Video Game</option>
            <option value="WEB_MANGA">Web Manga</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>
      </div>

      <!-- Row 3: Exclude list, Sort & Action Button -->
      <div class="filter-bottom-bar">
        <div class="filter-select-wrap">
          <select class="filter-select" id="filterExclude">
            <option value="">Exclude genre</option>
            <option value="Ecchi">Ecchi</option>
            <option value="Horror">Horror</option>
            <option value="Psychological">Psychological</option>
            <option value="Mecha">Mecha</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>

        <div class="filter-select-wrap">
          <select class="filter-select" id="filterSort">
            <option value="POPULARITY_DESC">Default (Most Popular)</option>
            <option value="TRENDING_DESC">Trending</option>
            <option value="SCORE_DESC">Top Rated</option>
            <option value="START_DATE_DESC">Recently Added</option>
            <option value="FAVOURITES_DESC">Most Favorited</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>

        <button type="button" class="anikoto-submit-btn" id="applyFilterBtn">
          <span class="material-symbols-outlined" style="font-size: 18px;">filter_alt</span> Filter
        </button>

        <button type="button" class="reset-link-btn" id="clearFilterBtn">
          <span class="material-symbols-outlined" style="font-size: 16px;">restart_alt</span> Reset
        </button>
      </div>
    </section>

    <!-- Results Status -->
    <div class="catalog-summary-row">
      <div>
        <h2 class="summary-title" id="summaryTitle">All Releases</h2>
        <p class="summary-subtext" id="summarySubtext">Showing results sorted by popularity</p>
      </div>
    </div>

    <!-- Cards Grid -->
    <section>
      <div class="anime-cards-grid" id="genreGrid"></div>

      <div class="infinite-scroll-sentinel" id="infiniteSentinel">
        <div class="loading-spinner"></div>
      </div>
    </section>

  </main>

  <script>
    let activeFilters = {
      search: "",
      genre: "",
      season: "",
      year: "",
      type: "ANIME",
      format: "",
      status: "",
      country: "",
      rating: "",
      source: "",
      exclude: "",
      sort: "POPULARITY_DESC"
    };

    let currentPage = 1;
    let hasNextPage = true;
    let isLoading = false;
    let currentLang = "EN";

    // Setup Header Search Popup
    const searchModal = document.getElementById('searchModal');
    const openSearchBtn = document.getElementById('openSearchBtn');
    const closeSearchBtn = document.getElementById('closeSearchBtn');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const langEn = document.getElementById('langEn');
    const langJp = document.getElementById('langJp');

    openSearchBtn.addEventListener('click', () => {
      searchModal.classList.add('active');
      setTimeout(() => searchInput.focus(), 100);
    });

    function closeSearch() {
      searchModal.classList.remove('active');
      searchInput.value = '';
      searchResults.style.display = 'none';
      searchResults.innerHTML = '';
    }

    closeSearchBtn.addEventListener('click', closeSearch);
    searchModal.addEventListener('click', (e) => { if (e.target === searchModal) closeSearch(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && searchModal.classList.contains('active')) closeSearch();
    });

    langEn.addEventListener('click', () => {
      currentLang = 'EN';
      langEn.classList.add('active');
      langJp.classList.remove('active');
      refreshTitles();
    });

    langJp.addEventListener('click', () => {
      currentLang = 'JP';
      langJp.classList.add('active');
      langEn.classList.remove('active');
      refreshTitles();
    });

    // Read Filter Values and Trigger Search
    function readInputs() {
      activeFilters.search = document.getElementById('filterKeyword').value.trim();
      activeFilters.genre = document.getElementById('filterGenre').value;
      activeFilters.season = document.getElementById('filterSeason').value;
      activeFilters.year = document.getElementById('filterYear').value;
      activeFilters.type = document.getElementById('filterType').value;
      activeFilters.format = document.getElementById('filterFormat').value;
      activeFilters.status = document.getElementById('filterStatus').value;
      activeFilters.country = document.getElementById('filterCountry').value;
      activeFilters.rating = document.getElementById('filterRating').value;
      activeFilters.source = document.getElementById('filterSource').value;
      activeFilters.exclude = document.getElementById('filterExclude').value;
      activeFilters.sort = document.getElementById('filterSort').value;
    }

    function resetFilters() {
      document.getElementById('filterKeyword').value = "";
      document.getElementById('filterGenre').value = "";
      document.getElementById('filterSeason').value = "";
      document.getElementById('filterYear').value = "";
      document.getElementById('filterType').value = "ANIME";
      document.getElementById('filterFormat').value = "";
      document.getElementById('filterStatus').value = "";
      document.getElementById('filterCountry').value = "";
      document.getElementById('filterRating').value = "";
      document.getElementById('filterSource').value = "";
      document.getElementById('filterExclude').value = "";
      document.getElementById('filterSort').value = "POPULARITY_DESC";

      readInputs();
      resetAndFetch();
    }

    document.getElementById('applyFilterBtn').addEventListener('click', () => {
      readInputs();
      resetAndFetch();
    });

    document.getElementById('clearFilterBtn').addEventListener('click', resetFilters);

    document.getElementById('filterKeyword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        readInputs();
        resetAndFetch();
      }
    });

    function updateSummary() {
      const parts = [];
      if (activeFilters.genre) parts.push(activeFilters.genre);
      if (activeFilters.season) parts.push(activeFilters.season);
      if (activeFilters.year) parts.push(activeFilters.year);
      if (activeFilters.format) parts.push(activeFilters.format);
      if (activeFilters.status) parts.push(activeFilters.status.replace(/_/g, ' '));
      if (activeFilters.source) parts.push(activeFilters.source.replace(/_/g, ' '));

      const title = activeFilters.search ? `Results for "${activeFilters.search}"` : (parts.length ? parts.join(' • ') : "All Releases");
      document.getElementById('summaryTitle').textContent = `${title} (${activeFilters.type})`;
      document.getElementById('summarySubtext').textContent = `Showing matched entries`;
    }

    function resetAndFetch() {
      currentPage = 1;
      hasNextPage = true;
      updateSummary();
      const grid = document.getElementById('genreGrid');
      grid.innerHTML = Array(12).fill(`
        <div class="card-wrap">
          <div class="anime-card skeleton" style="min-height: 280px;"></div>
        </div>
      `).join('');
      document.getElementById('infiniteSentinel').style.display = 'flex';
      fetchMedia(false);
    }

    async function fetchMedia(append = false) {
      if (isLoading || (!hasNextPage && append)) return;
      isLoading = true;

      let varDefs = '$page: Int, $type: MediaType,$sort: [MediaSort]';
      let mediaFilters = 'type: $type, sort:$sort, isAdult: false';

      const variables = {
        page: currentPage,
        type: activeFilters.type,
        sort: [activeFilters.sort]
      };

      if (activeFilters.search) {
        varDefs += ', $search: String';
        mediaFilters += ', search: $search';
        variables.search = activeFilters.search;
      }

      if (activeFilters.genre) {
        varDefs += ', $genre: String';
        mediaFilters += ', genre: $genre';
        variables.genre = activeFilters.genre;
      }

      if (activeFilters.season) {
        varDefs += ', $season: MediaSeason';
        mediaFilters += ', season: $season';
        variables.season = activeFilters.season;
      }

      if (activeFilters.year) {
        varDefs += ', $seasonYear: Int';
        mediaFilters += ', seasonYear: $seasonYear';
        variables.seasonYear = parseInt(activeFilters.year, 10);
      }

      if (activeFilters.format) {
        varDefs += ', $format: MediaFormat';
        mediaFilters += ', format: $format';
        variables.format = activeFilters.format;
      }

      if (activeFilters.status) {
        varDefs += ', $status: MediaStatus';
        mediaFilters += ', status: $status';
        variables.status = activeFilters.status;
      }

      if (activeFilters.country) {
        varDefs += ', $country: CountryCode';
        mediaFilters += ', countryOfOrigin: $country';
        variables.country = activeFilters.country;
      }

      if (activeFilters.source) {
        varDefs += ', $source: MediaSource';
        mediaFilters += ', source: $source';
        variables.source = activeFilters.source;
      }

      if (activeFilters.exclude) {
        varDefs += ', $genreNotIn: [String]';
        mediaFilters += ', genre_not_in: $genreNotIn';
        variables.genreNotIn = [activeFilters.exclude];
      }

      if (activeFilters.rating) {
        varDefs += ', $averageScoreGreater: Int';
        mediaFilters += ', averageScore_greater: $averageScoreGreater';
        variables.averageScoreGreater = parseInt(activeFilters.rating, 10);
      }

      const query = `
        query (${varDefs}) {
          Page(page: $page, perPage: 18) {
            pageInfo { hasNextPage }
            media(${mediaFilters}) {
              id
              type
              title { english romaji native }
              coverImage { extraLarge large }
              description
              averageScore
              episodes
              chapters
              format
              genres
            }
          }
        }
      `;

      try {
        const res = await fetch('https://graphql.anilist.co', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, variables })
        });

        const json = await res.json();
        const items = json?.data?.Page?.media || [];
        hasNextPage = json?.data?.Page?.pageInfo?.hasNextPage ?? false;

        renderCards(items, append);

        if (!hasNextPage) {
          document.getElementById('infiniteSentinel').style.display = 'none';
        }
      } catch (err) {
        if (!append) {
          document.getElementById('genreGrid').innerHTML = '<p style="color:var(--text-dim); text-align:center; padding:30px; grid-column:1/-1;">Failed to fetch results.</p>';
        }
      } finally {
        isLoading = false;
      }
    }

    function renderCards(items, append) {
      const grid = document.getElementById('genreGrid');
      if (!append && items.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-dim); text-align:center; padding:30px; grid-column:1/-1;">No anime or manga found matching these criteria.</p>';
        return;
      }

      const html = items.map(item => {
        const title = currentLang === 'JP' 
          ? (item.title.native || item.title.romaji) 
          : (item.title.english || item.title.romaji);

        const score = item.averageScore ? `${item.averageScore}%` : 'N/A';
        const count = item.episodes ? `${item.episodes} EP` : (item.chapters ? `${item.chapters} CH` : (item.format || 'Media'));
        const image = item.coverImage?.extraLarge || item.coverImage?.large || '';
        const cleanedDesc = item.description ? item.description.replace(/<[^>]*>?/gm, '') : 'No synopsis provided.';
        const tags = (item.genres || []).slice(0, 3).map(g => `<span class="hover-tag">${g}</span>`).join('');

        return `
          <div class="card-wrap" data-title-en="${escapeHtml(item.title.english || item.title.romaji)}" data-title-jp="${escapeHtml(item.title.native || item.title.romaji)}">
            <a href="entry.html?id=${item.id}" class="anime-card">
              <div class="card-thumb-wrap">
                <img src="${image}" alt="${title}" class="card-thumb" loading="lazy" />
                <div class="card-badge-top">★ ${score}</div>
                <div class="card-format-tag">${item.format || 'TV'}</div>
              </div>
              <div class="card-info">
                <h3 class="card-item-title" title="${title}">${title}</h3>
                <div class="card-item-sub">
                  <span>${count}</span>
                  <span>${item.format || 'MEDIA'}</span>
                </div>
              </div>
            </a>

            <div class="card-hover-bubble">
              <div class="hover-bubble-title">${title}</div>
              <div class="hover-bubble-meta">
                <span style="color: #10b981; font-weight: 600;">★ ${score}</span>
                <span>•</span>
                <span>${item.format || 'TV'}</span>
                <span>•</span>
                <span>${count}</span>
              </div>
              <div class="hover-bubble-tags">${tags}</div>
              <div class="hover-bubble-desc">${cleanedDesc}</div>
            </div>
          </div>
        `;
      }).join('');

      if (append) {
        grid.insertAdjacentHTML('beforeend', html);
      } else {
        grid.innerHTML = html;
      }

      setupCardBubbleRepositioning(grid);
    }

    function setupCardBubbleRepositioning(container) {
      container.querySelectorAll('.card-wrap').forEach(wrap => {
        wrap.addEventListener('mouseenter', () => {
          const rect = wrap.getBoundingClientRect();
          if (window.innerWidth - rect.right < 340) {
            wrap.classList.add('align-left');
          } else {
            wrap.classList.remove('align-left');
          }
        });
      });
    }

    function escapeHtml(text) {
      return text ? text.replace(/"/g, '&quot;').replace(/'/g, '&#39;') : '';
    }

    function refreshTitles() {
      document.querySelectorAll('.card-wrap').forEach(wrap => {
        const titleEl = wrap.querySelector('.card-item-title');
        const bubbleTitleEl = wrap.querySelector('.hover-bubble-title');
        const title = currentLang === 'JP' ? wrap.dataset.titleJp : wrap.dataset.titleEn;
        if (titleEl && title) {
          titleEl.textContent = title;
          titleEl.title = title;
        }
        if (bubbleTitleEl && title) {
          bubbleTitleEl.textContent = title;
        }
      });
    }

    // Modal Search Query
    let debounceTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        const keyword = e.target.value.trim();
        if (!keyword) {
          searchResults.style.display = 'none';
          return;
        }

        searchResults.style.display = 'flex';
        searchResults.innerHTML = '<div style="padding:15px; text-align:center; font-size:0.85rem; color:var(--text-dim);">Searching...</div>';

        const q = `
          query ($search: String) {
            Page(page: 1, perPage: 6) {
              media(search: $search, sort: POPULARITY_DESC) {
                id
                title { english romaji native }
                coverImage { medium }
                format
                averageScore
              }
            }
          }
        `;

        try {
          const res = await fetch('https://graphql.anilist.co', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: q, variables: { search: keyword } })
          });
          const data = await res.json();
          const items = data?.data?.Page?.media || [];

          if (!items.length) {
            searchResults.innerHTML = '<div style="padding:15px; text-align:center; font-size:0.85rem; color:var(--text-dim);">No results found.</div>';
            return;
          }

          searchResults.innerHTML = items.map(it => {
            const title = currentLang === 'JP' ? (it.title.native || it.title.romaji) : (it.title.english || it.title.romaji);
            return `
              <a href="entry.html?id=${it.id}" class="search-item">
                <img src="${it.coverImage.medium}" alt="${title}" class="search-thumb" />
                <div>
                  <div style="font-weight:600; font-size:0.9rem;">${title}</div>
                  <div style="font-size:0.75rem; color:var(--text-dim); margin-top:2px;">
                    <span>${it.format || 'ANIME'}</span> • <span style="color:#10b981;">★ ${it.averageScore ? it.averageScore + '%' : 'N/A'}</span>
                  </div>
                </div>
              </a>
            `;
          }).join('');
        } catch(err) {}
      }, 350);
    });

    // Infinite Scroll
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !isLoading && hasNextPage) {
        currentPage++;
        fetchMedia(true);
      }
    }, { rootMargin: '400px' });

    observer.observe(document.getElementById('infiniteSentinel'));

    window.addEventListener('DOMContentLoaded', () => {
      readInputs();
      resetAndFetch();
    });
  </script>

</body>
</html>
