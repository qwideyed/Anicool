<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniRealm - Anime Details</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0b10;
      --bubble-bg: rgba(20, 22, 32, 0.85);
      --bubble-border: rgba(255, 255, 255, 0.1);
      --card-bg: rgba(255, 255, 255, 0.035);
      --accent-pink: #ff2a74;
      --accent-purple: #9d5cf6;
      --accent-blue: #00d2ff;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 42, 116, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(157, 92, 246, 0.1) 0%, transparent 40%);
    }

    .header-wrapper {
      position: sticky;
      top: 20px;
      z-index: 1000;
      display: flex;
      justify-content: center;
      padding: 0 20px;
    }

    .bubble-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1280px;
      padding: 8px 24px;
      background: var(--bubble-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .logo a {
      font-size: 1.35rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      display: inline-block;
      letter-spacing: 0.5px;
      transition: transform 0.25s ease;
    }

    .logo a:hover {
      transform: scale(1.05);
    }

    .logo span {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      list-style: none;
      align-items: center;
      gap: 12px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 9999px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .search-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--bubble-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .search-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-pink);
      transform: scale(1.06);
      box-shadow: 0 0 16px rgba(255, 42, 116, 0.35);
    }

    .search-modal {
      position: fixed;
      inset: 0;
      background: rgba(7, 8, 12, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 8vh;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      z-index: 2000;
    }

    .search-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .search-container {
      width: 90%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: translateY(-20px) scale(0.95);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .search-modal.active .search-container {
      transform: translateY(0) scale(1);
    }

    .search-presets-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 4px;
      flex-wrap: wrap;
    }

    .presets-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preset-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bubble-border);
      color: var(--text-dim);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .preset-pill.active {
      background: var(--accent-pink);
      color: #fff;
      border-color: var(--accent-pink);
    }

    .search-box-popup {
      background: rgba(22, 24, 34, 0.95);
      border: 1px solid var(--bubble-border);
      border-radius: 24px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box-popup input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1.05rem;
      font-family: inherit;
    }

    .lang-toggle {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      padding: 2px;
      gap: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .close-search-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .search-results {
      max-height: 440px;
      overflow-y: auto;
      background: rgba(20, 22, 32, 0.95);
      border: 1px solid var(--bubble-border);
      border-radius: 20px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px;
      border-radius: 14px;
      text-decoration: none;
      color: #fff;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s ease;
    }

    .search-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(4px);
    }

    .search-thumb {
      width: 48px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
    }

    /* ================= ENTRY HERO & BACKDROP ================= */
    .entry-backdrop-container {
      position: relative;
      width: 100%;
      min-height: 480px;
      background-size: cover;
      background-position: center 25%;
      margin-top: -85px;
      display: flex;
      align-items: flex-end;
    }

    .backdrop-overlay {
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(0deg, var(--bg-dark) 10%, rgba(10, 11, 16, 0.85) 50%, rgba(10, 11, 16, 0.4) 100%),
        radial-gradient(circle at 50% 30%, transparent 20%, var(--bg-dark) 90%);
    }

    .entry-main-wrapper {
      position: relative;
      z-index: 2;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 30px 80px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .entry-top-card {
      display: flex;
      gap: 40px;
      align-items: flex-start;
      margin-top: -120px;
    }

    .entry-poster-wrap {
      width: 260px;
      flex-shrink: 0;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--bubble-border);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      background: #12141f;
      aspect-ratio: 1 / 1.42;
    }

    .entry-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .entry-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 40px;
    }

    .entry-badge-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .entry-pill {
      background: rgba(255, 42, 116, 0.15);
      border: 1px solid rgba(255, 42, 116, 0.35);
      color: var(--accent-pink);
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .entry-score-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #10b981;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .entry-tag-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--bubble-border);
      color: #cbd5e1;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
    }

    .entry-title {
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1.2;
      color: #fff;
    }

    .entry-alt-title {
      font-size: 1.05rem;
      color: var(--text-dim);
      font-weight: 400;
      margin-top: -6px;
    }

    .entry-action-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 6px 0;
      flex-wrap: wrap;
    }

    .bubble-btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(255, 42, 116, 0.35);
      transition: all 0.25s ease;
      cursor: pointer;
      border: none;
    }

    .bubble-btn-primary:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 30px rgba(255, 42, 116, 0.5);
    }

    .bubble-btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--bubble-border);
      color: #fff;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 500;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .bubble-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .entry-synopsis {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #cbd5e1;
      background: rgba(20, 22, 32, 0.4);
      padding: 18px 22px;
      border-radius: 20px;
      border: 1px solid var(--bubble-border);
    }

    /* ================= STATS & DETAILS GRID ================= */
    .details-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--bubble-border);
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-card-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #71778e;
      font-weight: 600;
    }

    .stat-card-value {
      font-size: 0.95rem;
      color: #fff;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ================= EPISODES SECTION ================= */
    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--bubble-border);
      border-radius: 28px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      backdrop-filter: blur(20px);
    }

    .section-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .section-card-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ep-search-bubble {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      padding: 6px 14px;
      gap: 8px;
    }

    .ep-search-bubble input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.82rem;
      width: 120px;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .episodes-grid::-webkit-scrollbar {
      width: 5px;
    }

    .episodes-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .ep-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--bubble-border);
      border-radius: 12px;
      padding: 12px 6px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .ep-pill:hover,
    .ep-pill.active {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(255, 42, 116, 0.4);
    }

    /* ================= CHARACTERS ROW ================= */
    .characters-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 16px;
    }

    .char-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: center;
    }

    .char-avatar-wrap {
      width: 100%;
      aspect-ratio: 1 / 1.25;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--bubble-border);
      background: #141624;
    }

    .char-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .char-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .char-role {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: -4px;
    }

    /* Skeleton */
    .skeleton {
      animation: skeleton-pulse 1.5s infinite ease-in-out;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.04) 75%);
      background-size: 200% 100%;
    }

    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 860px) {
      .entry-top-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .entry-poster-wrap {
        width: 200px;
      }
      .entry-info {
        padding-top: 0;
        align-items: center;
      }
      .entry-title {
        font-size: 1.8rem;
      }
      .entry-action-bar {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Header -->
  <div class="header-wrapper">
    <header class="bubble-nav">
      
      <div class="logo">
        <a href="index.html">Ani<span>Realm</span></a>
      </div>

      <nav>
        <ul class="nav-links">
          <li class="nav-item">
            <a href="index.html" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a href="index.html#mylist" class="nav-link">My List</a>
          </li>
          <li class="nav-item">
            <a href="index.html#websites" class="nav-link">Websites</a>
          </li>
        </ul>
      </nav>

      <div class="actions">
        <button type="button" class="search-btn" id="openSearchBtn" aria-label="Open Search">
          <span class="material-symbols-outlined">search</span>
        </button>
      </div>

    </header>
  </div>

  <!-- Search Modal -->
  <div class="search-modal" id="searchModal">
    <div class="search-container">
      <div class="search-presets-bar">
        <div class="presets-group">
          <button type="button" class="preset-pill active" data-preset="all">All</button>
          <button type="button" class="preset-pill" data-preset="anime">Anime</button>
          <button type="button" class="preset-pill" data-preset="manga">Manga</button>
        </div>
      </div>

      <div class="search-box-popup">
        <span class="material-symbols-outlined">search</span>
        <input type="text" id="searchInput" placeholder="Search anime or manga..." autocomplete="off" />
        <div class="lang-toggle">
          <button type="button" class="lang-btn active" id="langEn">EN</button>
          <button type="button" class="lang-btn" id="langJp">JP</button>
        </div>
        <button type="button" class="close-search-btn" id="closeSearchBtn">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="search-results" id="searchResults" style="display: none;"></div>
    </div>
  </div>

  <!-- Backdrop Top Section -->
  <div class="entry-backdrop-container skeleton" id="entryBackdrop">
    <div class="backdrop-overlay"></div>
  </div>

  <!-- Main Details Body -->
  <main class="entry-main-wrapper">
    
    <!-- Top Details Card -->
    <div class="entry-top-card">
      <div class="entry-poster-wrap">
        <img src="" alt="Poster" class="entry-poster" id="entryPoster" />
      </div>

      <div class="entry-info">
        <div class="entry-badge-row" id="entryBadges">
          <span class="entry-pill" id="entryFormat">TV</span>
          <span class="entry-score-pill">★ <span id="entryScore">--</span></span>
          <span class="entry-tag-pill" id="entryStatus">Releasing</span>
          <span class="entry-tag-pill" id="entryEpisodes">24 Episodes</span>
        </div>

        <h1 class="entry-title" id="entryTitle">Loading Details...</h1>
        <div class="entry-alt-title" id="entryAltTitle">...</div>

        <div class="entry-action-bar">
          <a href="#player" class="bubble-btn-primary" id="watchStartBtn">
            <span class="material-symbols-outlined">play_arrow</span> Watch Episode 1
          </a>
          <button type="button" class="bubble-btn-secondary" id="bookmarkBtn">
            <span class="material-symbols-outlined">bookmark_add</span> Add to List
          </button>
          <a href="#" target="_blank" rel="noopener" class="bubble-btn-secondary" id="trailerBtn" style="display: none;">
            <span class="material-symbols-outlined">movie</span> Trailer
          </a>
        </div>

        <div class="entry-synopsis" id="entrySynopsis">
          Connecting to AniList API...
        </div>
      </div>
    </div>

    <!-- Quick Meta Information Grid -->
    <div class="details-stats-grid">
      <div class="stat-card">
        <span class="stat-card-label">Studio</span>
        <span class="stat-card-value" id="statStudio">--</span>
      </div>
      <div class="stat-card">
        <span class="stat-card-label">Season / Year</span>
        <span class="stat-card-value" id="statSeason">--</span>
      </div>
      <div class="stat-card">
        <span class="stat-card-label">Genres</span>
        <span class="stat-card-value" id="statGenres">--</span>
      </div>
      <div class="stat-card">
        <span class="stat-card-label">Duration</span>
        <span class="stat-card-value" id="statDuration">--</span>
      </div>
      <div class="stat-card">
        <span class="stat-card-label">Source</span>
        <span class="stat-card-value" id="statSource">--</span>
      </div>
    </div>

    <!-- Episode Selection Section -->
    <section class="section-card">
      <div class="section-card-head">
        <div class="section-card-title">
          <span class="material-symbols-outlined" style="color: var(--accent-pink);">video_library</span>
          Episodes
        </div>
        <div class="ep-search-bubble">
          <span class="material-symbols-outlined" style="font-size: 16px;">search</span>
          <input type="text" id="epSearchInput" placeholder="Filter ep..." />
        </div>
      </div>

      <div class="episodes-grid" id="episodesGrid"></div>
    </section>

    <!-- Characters Section -->
    <section class="section-card">
      <div class="section-card-head">
        <div class="section-card-title">
          <span class="material-symbols-outlined" style="color: var(--accent-purple);">group</span>
          Main Characters
        </div>
      </div>
      <div class="characters-row" id="charactersRow"></div>
    </section>

  </main>

  <!-- AniList Fetch & Interactive Handler Script -->
  <script>
    // Search Popup Elements
    const searchModal = document.getElementById('searchModal');
    const openSearchBtn = document.getElementById('openSearchBtn');
    const closeSearchBtn = document.getElementById('closeSearchBtn');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const langEn = document.getElementById('langEn');
    const langJp = document.getElementById('langJp');

    let currentLang = 'EN';
    let currentAnimeData = null;
    let debounceTimer;

    // Search Open/Close
    openSearchBtn.addEventListener('click', () => {
      searchModal.classList.add('active');
      setTimeout(() => searchInput.focus(), 100);
    });

    function closeSearch() {
      searchModal.classList.remove('active');
      searchInput.value = '';
      searchResults.style.display = 'none';
      searchResults.innerHTML = '';
    }

    closeSearchBtn.addEventListener('click', closeSearch);
    searchModal.addEventListener('click', (e) => { if (e.target === searchModal) closeSearch(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && searchModal.classList.contains('active')) closeSearch();
    });

    // Language Toggle
    langEn.addEventListener('click', () => {
      currentLang = 'EN';
      langEn.classList.add('active');
      langJp.classList.remove('active');
      updateDisplayTitles();
    });

    langJp.addEventListener('click', () => {
      currentLang = 'JP';
      langJp.classList.add('active');
      langEn.classList.remove('active');
      updateDisplayTitles();
    });

    // Extract ID from Query String (or default to 151807 / Solo Leveling if opened standalone)
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    const currentMediaId = parseInt(getQueryParam('id'), 10) || 151807;

    async function loadEntryDetails(id) {
      const query = `
        query ($id: Int) {
          Media(id: $id) {
            id
            type
            title { english romaji native }
            coverImage { extraLarge large }
            bannerImage
            description
            averageScore
            episodes
            chapters
            duration
            status
            format
            season
            seasonYear
            source
            genres
            trailer { id site }
            studios(isMain: true) {
              nodes { name }
            }
            characters(sort: ROLE, perPage: 7) {
              edges {
                role
                node {
                  name { full }
                  image { medium }
                }
              }
            }
          }
        }
      `;

      try {
        const response = await fetch('https://graphql.anilist.co', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, variables: { id } })
        });

        const json = await response.json();
        currentAnimeData = json?.data?.Media;
        if (currentAnimeData) {
          renderPageDetails(currentAnimeData);
        }
      } catch (err) {
        document.getElementById('entryTitle').textContent = 'Failed to load media details.';
      }
    }

    function renderPageDetails(media) {
      document.title = `${media.title.english || media.title.romaji} - AniRealm`;

      const backdrop = document.getElementById('entryBackdrop');
      const poster = document.getElementById('entryPoster');
      const score = document.getElementById('entryScore');
      const format = document.getElementById('entryFormat');
      const status = document.getElementById('entryStatus');
      const epCount = document.getElementById('entryEpisodes');
      const synopsis = document.getElementById('entrySynopsis');
      const trailerBtn = document.getElementById('trailerBtn');

      backdrop.classList.remove('skeleton');
      const bgImage = media.bannerImage || media.coverImage.extraLarge;
      backdrop.style.backgroundImage = `url('${bgImage}')`;
      poster.src = media.coverImage.extraLarge || media.coverImage.large;

      score.textContent = media.averageScore ? `${media.averageScore}%` : 'N/A';
      format.textContent = media.format || 'TV';
      status.textContent = media.status || 'UNKNOWN';
      epCount.textContent = media.episodes ? `${media.episodes} Episodes` : (media.chapters ? `${media.chapters} Chapters` : 'Ongoing');

      synopsis.innerHTML = media.description ? media.description : 'No synopsis available.';

      // Stats
      document.getElementById('statStudio').textContent = media.studios?.nodes?.[0]?.name || 'Unknown Studio';
      document.getElementById('statSeason').textContent = (media.season && media.seasonYear) ? `${media.season} ${media.seasonYear}` : (media.seasonYear || 'N/A');
      document.getElementById('statGenres').textContent = (media.genres || []).slice(0, 3).join(', ') || 'N/A';
      document.getElementById('statDuration').textContent = media.duration ? `${media.duration} mins` : 'N/A';
      document.getElementById('statSource').textContent = media.source ? media.source.replace(/_/g, ' ') : 'Original';

      // Trailer Button
      if (media.trailer && media.trailer.site === 'youtube') {
        trailerBtn.href = `https://www.youtube.com/watch?v=${media.trailer.id}`;
        trailerBtn.style.display = 'inline-flex';
      }

      updateDisplayTitles();
      buildEpisodesList(media.episodes || 12);
      buildCharactersList(media.characters?.edges || []);
    }

    function updateDisplayTitles() {
      if (!currentAnimeData) return;
      const titleEl = document.getElementById('entryTitle');
      const altTitleEl = document.getElementById('entryAltTitle');

      if (currentLang === 'JP') {
        titleEl.textContent = currentAnimeData.title.native || currentAnimeData.title.romaji;
        altTitleEl.textContent = currentAnimeData.title.english || currentAnimeData.title.romaji;
      } else {
        titleEl.textContent = currentAnimeData.title.english || currentAnimeData.title.romaji;
        altTitleEl.textContent = currentAnimeData.title.native || currentAnimeData.title.romaji;
      }
    }

    function buildEpisodesList(count) {
      const grid = document.getElementById('episodesGrid');
      let html = '';
      for (let i = 1; i <= count; i++) {
        html += `<a href="#watch-ep-${i}" class="ep-pill ${i === 1 ? 'active' : ''}">EP ${i}</a>`;
      }
      grid.innerHTML = html;

      // Filter Episodes
      const epSearch = document.getElementById('epSearchInput');
      epSearch.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        const pills = grid.querySelectorAll('.ep-pill');
        pills.forEach(p => {
          if (!val || p.textContent.toLowerCase().includes(val.toLowerCase())) {
            p.style.display = 'block';
          } else {
            p.style.display = 'none';
          }
        });
      });
    }

    function buildCharactersList(chars) {
      const row = document.getElementById('charactersRow');
      if (!chars.length) {
        row.innerHTML = '<p style="color: var(--text-dim); font-size: 0.85rem;">No character information available.</p>';
        return;
      }

      row.innerHTML = chars.map(c => `
        <div class="char-card">
          <div class="char-avatar-wrap">
            <img src="${c.node.image?.medium || ''}" alt="${c.node.name?.full}" class="char-avatar" loading="lazy" />
          </div>
          <div class="char-name" title="${c.node.name?.full}">${c.node.name?.full}</div>
          <div class="char-role">${c.role || 'Main'}</div>
        </div>
      `).join('');
    }

    // Search Popup Fetching (Redirects right here on click)
    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        const keyword = e.target.value.trim();
        if (!keyword) {
          searchResults.style.display = 'none';
          return;
        }

        searchResults.style.display = 'flex';
        searchResults.innerHTML = '<div style="padding:15px; text-align:center; font-size:0.85rem; color:var(--text-dim);">Searching...</div>';

        const q = `
          query ($search: String) {
            Page(page: 1, perPage: 6) {
              media(search: $search, sort: POPULARITY_DESC) {
                id
                title { english romaji native }
                coverImage { medium }
                format
                averageScore
              }
            }
          }
        `;

        try {
          const res = await fetch('https://graphql.anilist.co', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: q, variables: { search: keyword } })
          });
          const data = await res.json();
          const items = data?.data?.Page?.media || [];

          if (!items.length) {
            searchResults.innerHTML = '<div style="padding:15px; text-align:center; font-size:0.85rem; color:var(--text-dim);">No results found.</div>';
            return;
          }

          searchResults.innerHTML = items.map(it => {
            const title = currentLang === 'JP' ? (it.title.native || it.title.romaji) : (it.title.english || it.title.romaji);
            return `
              <a href="entry.html?id=${it.id}" class="search-item">
                <img src="${it.coverImage.medium}" alt="${title}" class="search-thumb" />
                <div>
                  <div style="font-weight:600; font-size:0.9rem;">${title}</div>
                  <div style="font-size:0.75rem; color:var(--text-dim); margin-top:2px;">
                    <span>${it.format || 'ANIME'}</span> • <span style="color:#10b981;">★ ${it.averageScore ? it.averageScore + '%' : 'N/A'}</span>
                  </div>
                </div>
              </a>
            `;
          }).join('');
        } catch(err) {}
      }, 350);
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadEntryDetails(currentMediaId);
    });
  </script>

</body>
</html>
