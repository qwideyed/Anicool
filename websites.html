<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniCool - Recommended Websites</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0b10;
      --bubble-bg: rgba(20, 22, 32, 0.85);
      --bubble-border: rgba(255, 255, 255, 0.1);
      --card-bg: rgba(255, 255, 255, 0.035);
      --accent-pink: #ff2a74;
      --accent-purple: #9d5cf6;
      --accent-blue: #00d2ff;
      --discord-color: #5865F2;
      --donate-color: #f43f5e;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 42, 116, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(157, 92, 246, 0.1) 0%, transparent 40%);
    }

    /* Header Nav */
    .header-wrapper {
      position: sticky;
      top: 16px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
    }

    .bubble-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: fit-content;
      min-width: 580px;
      padding: 5px 18px;
      background: var(--bubble-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .logo a {
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      display: inline-block;
      letter-spacing: 0.5px;
      transition: transform 0.25s ease;
    }

    .logo a:hover {
      transform: scale(1.05);
    }

    .logo span {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      list-style: none;
      align-items: center;
      gap: 6px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 9999px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    .outside-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .outside-bubble-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 44px;
      padding: 0 16px;
      background: var(--bubble-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transition: all 0.25s ease;
    }

    .outside-bubble-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .outside-bubble-btn.discord-btn:hover {
      background: rgba(88, 101, 242, 0.2);
      border-color: var(--discord-color);
      color: #fff;
      transform: translateY(-2px);
    }

    .outside-bubble-btn.donate-btn:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--donate-color);
      color: #fff;
      transform: translateY(-2px);
    }

    /* Main Content */
    .main-content {
      max-width: 1240px;
      margin: 0 auto;
      padding: 30px 20px 80px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Hero */
    .websites-hero {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid rgba(0, 210, 255, 0.35);
      color: var(--accent-blue);
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hero-title {
      font-size: 2.4rem;
      font-weight: 800;
      color: #fff;
    }

    .hero-title span {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtext {
      max-width: 680px;
      font-size: 0.95rem;
      color: var(--text-dim);
      line-height: 1.6;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--card-bg);
      border: 1px solid var(--bubble-border);
      border-radius: 20px;
      padding: 14px 20px;
      backdrop-filter: blur(16px);
    }

    .category-filter-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--bubble-border);
      color: var(--text-dim);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 9999px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .cat-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .cat-btn.active {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(255, 42, 116, 0.35);
    }

    .site-search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      padding: 6px 14px;
      width: 240px;
    }

    .site-search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.84rem;
      font-family: inherit;
      width: 100%;
    }

    .site-search-box input::placeholder {
      color: #64748b;
    }

    /* Website Cards Grid */
    .websites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .site-card {
      background: var(--card-bg);
      border: 1px solid var(--bubble-border);
      border-radius: 22px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(16px);
      transition: all 0.25s ease;
      position: relative;
    }

    .site-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }

    .site-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .site-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .site-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bubble-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      color: #fff;
      flex-shrink: 0;
    }

    .site-name-wrap h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .site-domain {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .site-badge-pill {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .badge-anime {
      background: rgba(0, 210, 255, 0.15);
      border: 1px solid rgba(0, 210, 255, 0.35);
      color: var(--accent-blue);
    }

    .badge-manga {
      background: rgba(157, 92, 246, 0.15);
      border: 1px solid rgba(157, 92, 246, 0.35);
      color: var(--accent-purple);
    }

    .badge-tools {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #10b981;
    }

    .badge-adult {
      background: rgba(255, 42, 116, 0.15);
      border: 1px solid rgba(255, 42, 116, 0.35);
      color: var(--accent-pink);
    }

    .site-desc {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.55;
      flex: 1;
    }

    .site-meta-tags {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .meta-tag {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .site-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bubble-border);
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .site-btn:hover {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(255, 42, 116, 0.35);
      transform: translateY(-1px);
    }

    @media (max-width: 860px) {
      .header-wrapper {
        flex-wrap: wrap;
      }
      .bubble-nav {
        min-width: 0;
        width: 100%;
      }
      .websites-grid {
        grid-template-columns: 1fr;
      }
      .controls-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .site-search-box {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Nav Header -->
  <div class="header-wrapper">
    <header class="bubble-nav">
      <div class="logo">
        <a href="index.html">Ani<span>Cool</span></a>
      </div>

      <nav>
        <ul class="nav-links">
          <li class="nav-item">
            <a href="index.html" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a href="genre.html" class="nav-link">Genre</a>
          </li>
          <li class="nav-item">
            <a href="websites.html" class="nav-link active">Websites</a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="outside-btn-group">
      <a href="https://discord.gg" target="_blank" rel="noopener" class="outside-bubble-btn discord-btn" title="Join Discord">
        <svg viewBox="0 0 127.14 96.36">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.86,53,48.81,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
        </svg>
        <span>Discord</span>
      </a>

      <a href="donate.html" class="outside-bubble-btn donate-btn" title="Donate">
        <span class="material-symbols-outlined" style="color: var(--donate-color); font-size: 18px;">favorite</span>
        <span>Donate</span>
      </a>
    </div>
  </div>

  <main class="main-content">

    <!-- Hero Header -->
    <section class="websites-hero">
      <div class="hero-badge">
        <span class="material-symbols-outlined" style="font-size: 16px;">explore</span>
        Index &amp; Directories
      </div>
      <h1 class="hero-title">Curated <span>Websites</span> Index</h1>
      <p class="hero-subtext">
        Top community-vetted platforms for watching anime, reading manga &amp; manhwa, tracking watchlists, and community tools.
      </p>
    </section>

    <!-- Filters & Search Bar -->
    <section class="controls-bar">
      <div class="category-filter-pills" id="categoryPills">
        <button type="button" class="cat-btn active" data-cat="all">All Sites</button>
        <button type="button" class="cat-btn" data-cat="anime">Anime</button>
        <button type="button" class="cat-btn" data-cat="manga">Manga / Manhwa</button>
        <button type="button" class="cat-btn" data-cat="tools">Trackers &amp; Tools</button>
        <button type="button" class="cat-btn" data-cat="adult">Adult (18+)</button>
      </div>

      <div class="site-search-box">
        <span class="material-symbols-outlined" style="font-size: 18px; color: #64748b;">search</span>
        <input type="text" id="siteSearchInput" placeholder="Filter sites..." autocomplete="off" />
      </div>
    </section>

    <!-- Websites Grid -->
    <section class="websites-grid" id="websitesGrid">
      <!-- Populated by JavaScript -->
    </section>

  </main>

  <script>
    const SITES_DATA = [
      {
        name: "Anikoto",
        category: "anime",
        badge: "Anime",
        badgeClass: "badge-anime",
        domain: "anikoto.me",
        url: "https://anikoto.me",
        desc: "Modern, streamlined interface featuring comprehensive catalog filters, multi-source video playback, and schedule tabs.",
        tags: ["No Forced Ads", "HD Streams", "Sub / Dub"]
      },
      {
        name: "AniWatch",
        category: "anime",
        badge: "Anime",
        badgeClass: "badge-anime",
        domain: "aniwatchtv.to",
        url: "https://aniwatchtv.to",
        desc: "High-speed streaming platform with synced watchrooms, user reviews, customizable video player, and notification feeds.",
        tags: ["Fast Servers", "Watch2Gether", "Community"]
      },
      {
        name: "HiAnime",
        category: "anime",
        badge: "Anime",
        badgeClass: "badge-anime",
        domain: "hianime.to",
        url: "https://hianime.to",
        desc: "Extensive anime library covering seasonal series, specials, and movies with dual audio tracks and auto-skip intros.",
        tags: ["Dual Audio", "Skip Intro", "Huge Catalog"]
      },
      {
        name: "MangaDex",
        category: "manga",
        badge: "Manga",
        badgeClass: "badge-manga",
        domain: "mangadex.org",
        url: "https://mangadex.org",
        desc: "Open-source reader supported by volunteer scanlation groups across dozens of languages with zero invasive ads.",
        tags: ["Ad-Free", "Multi-Language", "Open API"]
      },
      {
        name: "Asura Scans",
        category: "manga",
        badge: "Manhwa",
        badgeClass: "badge-manga",
        domain: "asuracomic.net",
        url: "https://asuracomic.net",
        desc: "Premier scanlation group and reader specialized in high-definition Korean webtoons, action manhwa, and system leveling series.",
        tags: ["Action Manhwa", "Fast Releases", "High Res"]
      },
      {
        name: "Flame Comics",
        category: "manga",
        badge: "Manhwa",
        badgeClass: "badge-manga",
        domain: "flamecomics.xyz",
        url: "https://flamecomics.xyz",
        desc: "Dedicated comic reader focused on martial arts, fantasy reincarnation, and popular webtoon translations with clean typography.",
        tags: ["Webtoons", "Fast Scans", "Mobile Friendly"]
      },
      {
        name: "AniList",
        category: "tools",
        badge: "Tracker",
        badgeClass: "badge-tools",
        domain: "anilist.co",
        url: "https://anilist.co",
        desc: "Modern media discovery and scoring platform providing public GraphQL APIs, progress tracking, and custom score scales.",
        tags: ["Official API", "No Ads", "Social Tracker"]
      },
      {
        name: "MyAnimeList",
        category: "tools",
        badge: "Database",
        badgeClass: "badge-tools",
        domain: "myanimelist.net",
        url: "https://myanimelist.net",
        desc: "The web's oldest and largest anime and manga database with community forums, character wikis, voice actor rankings, and reviews.",
        tags: ["Large Database", "Forums", "Rankings"]
      },
      {
        name: "LiveChart.me",
        category: "tools",
        badge: "Schedule",
        badgeClass: "badge-tools",
        domain: "livechart.me",
        url: "https://livechart.me",
        desc: "Clean seasonal countdown calendar and airing schedule showing countdown clocks and broadcast channels in your local timezone.",
        tags: ["Airing Schedule", "Countdowns", "Timezone Sync"]
      },
      {
        name: "Hanime.tv",
        category: "adult",
        badge: "18+ Adult",
        badgeClass: "badge-adult",
        domain: "hanime.tv",
        url: "https://hanime.tv",
        desc: "Curated adult animation streaming hub with high-definition servers, tag-based discovery, and community playlists.",
        tags: ["18+", "HD Player", "Tag Filters"]
      },
      {
        name: "HentaiHaven",
        category: "adult",
        badge: "18+ Adult",
        badgeClass: "badge-adult",
        domain: "hentaihaven.xxx",
        url: "https://hentaihaven.xxx",
        desc: "Legacy adult animation portal hosting retro classics alongside newly aired uncensored releases.",
        tags: ["18+", "Retro & New", "Categories"]
      }
    ];

    let activeCategory = "all";
    let searchQuery = "";

    function renderSites() {
      const grid = document.getElementById("websitesGrid");
      
      const filtered = SITES_DATA.filter(site => {
        const matchesCategory = activeCategory === "all" || site.category === activeCategory;
        const matchesSearch = !searchQuery || 
          site.name.toLowerCase().includes(searchQuery) ||
          site.desc.toLowerCase().includes(searchQuery) ||
          site.domain.toLowerCase().includes(searchQuery) ||
          site.tags.some(t => t.toLowerCase().includes(searchQuery));

        return matchesCategory && matchesSearch;
      });

      if (!filtered.length) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-dim); font-size: 0.95rem;">
            No sites match your search or filter criteria.
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(site => {
        const firstLetter = site.name.charAt(0).toUpperCase();
        return `
          <div class="site-card">
            <div class="site-card-top">
              <div class="site-brand">
                <div class="site-icon-box">${firstLetter}</div>
                <div class="site-name-wrap">
                  <h3>${site.name}</h3>
                  <span class="site-domain">${site.domain}</span>
                </div>
              </div>
              <span class="site-badge-pill ${site.badgeClass}">${site.badge}</span>
            </div>

            <p class="site-desc">${site.desc}</p>

            <div class="site-meta-tags">
              ${site.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}
            </div>

            <a href="${site.url}" target="_blank" rel="noopener noreferrer" class="site-btn">
              <span>Visit Site</span>
              <span class="material-symbols-outlined" style="font-size: 16px;">open_in_new</span>
            </a>
          </div>
        `;
      }).join('');
    }

    // Category Filter Buttons
    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.dataset.cat;
        renderSites();
      });
    });

    // Instant Search Input
    document.getElementById("siteSearchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderSites();
    });

    window.addEventListener("DOMContentLoaded", renderSites);
  </script>

</body>
</html>
