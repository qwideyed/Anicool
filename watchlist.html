<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniCool - My Watchlist</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AniCool" />
  <meta property="og:title" content="AniCool - My Watchlist" />
  <meta property="og:description" content="Manage your personal anime, manga, and manhwa collections." />
  <meta name="theme-color" content="#ff2a74" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0b10;
      --bubble-bg: rgba(20, 22, 32, 0.88);
      --bubble-border: rgba(255, 255, 255, 0.1);
      --card-bg: rgba(255, 255, 255, 0.035);
      --accent-pink: #ff2a74;
      --accent-purple: #9d5cf6;
      --accent-blue: #00d2ff;
      --discord-color: #5865F2;
      --donate-color: #f43f5e;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 42, 116, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(157, 92, 246, 0.1) 0%, transparent 40%);
    }

    /* Header Nav */
    .header-wrapper {
      position: sticky;
      top: 16px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
    }

    .bubble-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: fit-content;
      min-width: 0;
      padding: 5px 20px;
      background: var(--bubble-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .logo a {
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      display: inline-block;
      letter-spacing: 0.5px;
    }

    .logo span {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      list-style: none;
      align-items: center;
      gap: 6px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 9999px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    /* Outside Companion Buttons */
    .outside-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .outside-bubble-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 44px;
      padding: 0 16px;
      background: var(--bubble-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      white-space: nowrap;
    }

    .outside-bubble-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .outside-bubble-btn.discord-btn:hover {
      background: rgba(88, 101, 242, 0.2);
      border-color: var(--discord-color);
      color: #fff;
      box-shadow: 0 8px 24px rgba(88, 101, 242, 0.35);
    }

    .outside-bubble-btn.donate-btn:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--donate-color);
      color: #fff;
      box-shadow: 0 8px 24px rgba(244, 63, 94, 0.35);
    }

    /* Main Content */
    .watchlist-main-content {
      max-width: 1480px;
      margin: 0 auto;
      padding: 40px 30px 90px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Top Action Bar (Search, Import, Export, AniList Auth) */
    .top-action-bar {
      background: var(--bubble-bg);
      border: 1px solid var(--bubble-border);
      border-radius: 28px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .search-input-wrap {
      flex: 1;
      min-width: 260px;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--bubble-border);
      border-radius: 9999px;
      padding: 9px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input-wrap:focus-within {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-pink);
      box-shadow: 0 0 16px rgba(255, 42, 116, 0.3);
    }

    .search-input-wrap input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
    }

    .search-input-wrap input::placeholder {
      color: var(--text-dim);
    }

    .utility-actions-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .util-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bubble-border);
      color: var(--text-main);
      height: 40px;
      padding: 0 16px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
    }

    .util-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .util-btn.anilist-btn {
      background: rgba(0, 210, 255, 0.12);
      border-color: rgba(0, 210, 255, 0.35);
      color: #38bdf8;
    }

    .util-btn.anilist-btn:hover {
      background: rgba(0, 210, 255, 0.22);
      color: #fff;
    }

    .anilist-user-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 4px 12px 4px 6px;
      border-radius: 9999px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .anilist-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }

    .logout-mini-btn {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
      transition: color 0.2s;
    }

    .logout-mini-btn:hover {
      color: #ef4444;
    }

    /* Filter Bar Area */
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-label {
      font-size: 0.76rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding-left: 6px;
    }

    .pills-scroll-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .pills-scroll-row::-webkit-scrollbar {
      display: none;
    }

    .tab-pill {
      background: rgba(20, 22, 32, 0.75);
      border: 1px solid var(--bubble-border);
      color: var(--text-dim);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 9999px;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      backdrop-filter: blur(12px);
    }

    .tab-pill:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .tab-pill.active {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 16px rgba(255, 42, 116, 0.35);
    }

    .badge-counter {
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    /* Exact Index Card Grid Layout */
    .anime-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .card-wrap {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .card-wrap:hover {
      z-index: 100;
    }

    .anime-card {
      position: relative;
      width: 100%;
      height: 100%;
      background: #10131e;
      border: 1px solid var(--bubble-border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
    }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.42;
      overflow: hidden;
      background: #141622;
      flex-shrink: 0;
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-badge-top {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 17, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .card-format-tag {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(255, 42, 116, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .card-info {
      padding: 10px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      justify-content: space-between;
    }

    .card-item-title {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .card-item-sub {
      font-size: 0.75rem;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Quick Card Action Controls */
    .card-hover-controls {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 10;
      display: flex;
      gap: 5px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .card-wrap:hover .card-hover-controls {
      opacity: 1;
    }

    .ctrl-icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(15, 17, 24, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ctrl-icon-btn.danger-btn:hover {
      background: #ef4444;
      border-color: #ef4444;
    }

    .ctrl-icon-btn span {
      font-size: 15px;
    }

    /* Empty State */
    .empty-box {
      grid-column: 1 / -1;
      background: var(--bubble-bg);
      border: 1px dashed var(--bubble-border);
      border-radius: 28px;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
    }

    .empty-box-icon {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(255, 42, 116, 0.12);
      border: 1px solid rgba(255, 42, 116, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-pink);
    }

    .empty-box-icon span {
      font-size: 32px;
    }

    .empty-box h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .empty-box p {
      font-size: 0.88rem;
      color: var(--text-dim);
      max-width: 420px;
      line-height: 1.5;
    }

    .browse-link-btn {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      padding: 10px 24px;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(255, 42, 116, 0.35);
    }

    @media (max-width: 960px) {
      .header-wrapper {
        flex-wrap: wrap;
      }
      .bubble-nav {
        width: 100%;
      }
      .top-action-bar {
        padding: 18px 16px;
      }
      .search-input-wrap {
        min-width: 100%;
      }
      .anime-cards-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 16px;
      }
      .card-hover-controls {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Header Nav -->
  <div class="header-wrapper">
    <header class="bubble-nav">
      <div class="logo">
        <a href="index.html">Ani<span>Cool</span></a>
      </div>

      <nav>
        <ul class="nav-links">
          <li class="nav-item">
            <a href="index.html" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a href="release.html" class="nav-link">Release</a>
          </li>
          <li class="nav-item">
            <a href="genre.html" class="nav-link">Genre</a>
          </li>
          <li class="nav-item">
            <a href="watchlist.html" class="nav-link active">Watchlist</a>
          </li>
          <li class="nav-item">
            <a href="websites.html" class="nav-link">Websites</a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="outside-btn-group">
      <a href="https://discord.com/invite/tDny2ubsCx" target="_blank" rel="noopener" class="outside-bubble-btn discord-btn" title="Join our Discord">
        <svg viewBox="0 0 127.14 96.36">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.86,53,48.81,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
        </svg>

      </a>

      <a href="donations.html" class="outside-bubble-btn donate-btn" title="Support AniCool">
        <span class="material-symbols-outlined donate-icon">favorite</span>
        <span>Donate</span>
      </a>
    </div>
  </div>

  <main class="watchlist-main-content">

    <!-- Top Action Bar: Search, Import, Export, AniList Auth -->
    <div class="top-action-bar">
      <div class="search-input-wrap">
        <span class="material-symbols-outlined" style="color: var(--accent-pink); font-size: 20px;">search</span>
        <input type="text" id="watchlistSearch" placeholder="Search your personal library..." oninput="handleSearch(this.value)" />
      </div>

      <div class="utility-actions-wrap" id="authUtilityBox">
        <!-- Injected via JavaScript based on login state -->
      </div>
    </div>

    <!-- Filter 1: Media Types -->
    <div class="filter-section">
      <div class="filter-label">Library Type</div>
      <div class="pills-scroll-row" id="mediumPillsRow">
        <button type="button" class="tab-pill active" onclick="switchMedium('ALL', this)">
          <span>All Media</span>
        </button>
        <button type="button" class="tab-pill" onclick="switchMedium('ANIME', this)">
          <span>Anime List</span>
        </button>
        <button type="button" class="tab-pill" onclick="switchMedium('MANGA', this)">
          <span>Manga List</span>
        </button>
        <button type="button" class="tab-pill" onclick="switchMedium('HENTAI', this)">
          <span>Hentai List</span>
        </button>
        <button type="button" class="tab-pill" onclick="switchMedium('READ_HENTAI', this)">
          <span>Read Hentai List</span>
        </button>
        <button type="button" class="tab-pill" onclick="switchMedium('MANHWA', this)">
          <span>Manhwa List</span>
        </button>
      </div>
    </div>

    <!-- Filter 2: Tracking Status -->
    <div class="filter-section">
      <div class="filter-label">Tracking Status</div>
      <div class="pills-scroll-row" id="statusPillsRow">
        <button type="button" class="tab-pill active" onclick="switchStatus('ALL', this)">
          <span>All Statuses</span>
          <span class="badge-counter" id="badge-all">0</span>
        </button>
        <button type="button" class="tab-pill" onclick="switchStatus('watching', this)">
          <span class="material-symbols-outlined" style="font-size: 16px; color: var(--accent-pink);">play_circle</span>
          <span>Watching & Reading</span>
          <span class="badge-counter" id="badge-watching">0</span>
        </button>
        <button type="button" class="tab-pill" onclick="switchStatus('planning', this)">
          <span class="material-symbols-outlined" style="font-size: 16px; color: var(--accent-blue);">schedule</span>
          <span>Plan to Watch</span>
          <span class="badge-counter" id="badge-planning">0</span>
        </button>
        <button type="button" class="tab-pill" onclick="switchStatus('on_hold', this)">
          <span class="material-symbols-outlined" style="font-size: 16px; color: #f97316;">pause_circle</span>
          <span>On Hold</span>
          <span class="badge-counter" id="badge-on_hold">0</span>
        </button>
        <button type="button" class="tab-pill" onclick="switchStatus('completed', this)">
          <span class="material-symbols-outlined" style="font-size: 16px; color: #10b981;">task_alt</span>
          <span>Completed</span>
          <span class="badge-counter" id="badge-completed">0</span>
        </button>
        <button type="button" class="tab-pill" onclick="switchStatus('dropped', this)">
          <span class="material-symbols-outlined" style="font-size: 16px; color: #ef4444;">cancel</span>
          <span>Dropped</span>
          <span class="badge-counter" id="badge-dropped">0</span>
        </button>
        <button type="button" class="tab-pill" onclick="switchStatus('favorites', this)">
          <span class="material-symbols-outlined" style="font-size: 16px; color: #facc15;">star</span>
          <span>Favorites</span>
          <span class="badge-counter" id="badge-favorites">0</span>
        </button>
      </div>
    </div>

    <!-- Cards Output Grid -->
    <div class="anime-cards-grid" id="watchlistGrid"></div>

  </main>

  <script>
    const ANILIST_CLIENT_ID = '51511';

    let activeMedium = 'ALL';
    let activeStatus = 'ALL';
    let searchKeyword = '';

    function getStoredData() {
      try {
        return JSON.parse(localStorage.getItem('anicool_watchlist_items') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveStoredData(data) {
      localStorage.setItem('anicool_watchlist_items', JSON.stringify(data));
    }

    function handleSearch(val) {
      searchKeyword = (val || '').toLowerCase().trim();
      renderWatchlist();
    }

    function switchMedium(medium, btn) {
      document.querySelectorAll('#mediumPillsRow .tab-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeMedium = medium;
      renderWatchlist();
    }

    function switchStatus(status, btn) {
      document.querySelectorAll('#statusPillsRow .tab-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeStatus = status;
      renderWatchlist();
    }

    function updateCounters() {
      const data = getStoredData();
      const items = Object.values(data);

      document.getElementById('badge-all').textContent = items.length;
      document.getElementById('badge-watching').textContent = items.filter(i => i.status === 'watching').length;
      document.getElementById('badge-planning').textContent = items.filter(i => i.status === 'planning').length;
      document.getElementById('badge-on_hold').textContent = items.filter(i => i.status === 'on_hold').length;
      document.getElementById('badge-completed').textContent = items.filter(i => i.status === 'completed' || i.status === 'favorites').length;
      document.getElementById('badge-dropped').textContent = items.filter(i => i.status === 'dropped').length;
      document.getElementById('badge-favorites').textContent = items.filter(i => i.status === 'favorites').length;
    }

    /* Auth & 2-Way Sync Engine */
    function loginWithAniList() {
      const authUrl = `https://anilist.co/api/v2/oauth/authorize?client_id=${ANILIST_CLIENT_ID}&response_type=token`;
      window.location.href = authUrl;
    }

    function logoutAniList() {
      localStorage.removeItem('anicool_anilist_token');
      localStorage.removeItem('anicool_anilist_user');
      renderAuthBar();
    }

    function renderAuthBar() {
      const box = document.getElementById('authUtilityBox');
      const token = localStorage.getItem('anicool_anilist_token');
      let user = null;
      try {
        user = JSON.parse(localStorage.getItem('anicool_anilist_user') || 'null');
      } catch (e) {}

      if (token && user) {
        box.innerHTML = `
          <div class="anilist-user-badge">
            <img src="${user.avatar?.medium || 'favicon.png'}" alt="${user.name}" class="anilist-avatar" />
            <span>${user.name}</span>
            <button type="button" class="logout-mini-btn" onclick="logoutAniList()" title="Log out from AniList">
              <span class="material-symbols-outlined" style="font-size: 16px;">logout</span>
            </button>
          </div>

          <button type="button" class="util-btn anilist-btn" id="syncBtn" onclick="syncWithAniList()" title="Sync both ways with AniList">
            <span class="material-symbols-outlined" style="font-size: 18px;">sync</span>
            <span>Sync</span>
          </button>

          <label class="util-btn" title="Upload JSON Backup">
            <span class="material-symbols-outlined" style="font-size: 18px; color: var(--accent-blue);">upload_file</span>
            <span>Import</span>
            <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importWatchlist(event)" />
          </label>

          <button type="button" class="util-btn" onclick="exportWatchlist()" title="Download JSON Backup">
            <span class="material-symbols-outlined" style="font-size: 18px; color: var(--accent-pink);">download</span>
            <span>Export</span>
          </button>
        `;
      } else {
        box.innerHTML = `
          <button type="button" class="util-btn anilist-btn" onclick="loginWithAniList()" title="Connect your AniList Account">
            <span class="material-symbols-outlined" style="font-size: 18px;">account_circle</span>
            <span>Connect AniList</span>
          </button>

          <label class="util-btn" title="Upload JSON Backup">
            <span class="material-symbols-outlined" style="font-size: 18px; color: var(--accent-blue);">upload_file</span>
            <span>Import</span>
            <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importWatchlist(event)" />
          </label>

          <button type="button" class="util-btn" onclick="exportWatchlist()" title="Download JSON Backup">
            <span class="material-symbols-outlined" style="font-size: 18px; color: var(--accent-pink);">download</span>
            <span>Export</span>
          </button>
        `;
      }
    }

    /* Live write-back to AniList when an item is deleted */
    async function deleteItem(id, title, e) {
      e.stopPropagation();
      e.preventDefault();
      if (!confirm(`Remove "${title}" from your library?`)) return;

      const data = getStoredData();
      delete data[id];
      saveStoredData(data);
      updateCounters();
      renderWatchlist();

      // Write-back: delete/remove from actual AniList account if logged in
      const token = localStorage.getItem('anicool_anilist_token');
      if (token) {
        try {
          // Get the mediaList entry id to delete it
          const checkRes = await fetch('https://graphql.anilist.co', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              query: `query ($mediaId: Int) { Media(id: $mediaId) { mediaListEntry { id } } }`,
              variables: { mediaId: id }
            })
          });
          const checkJson = await checkRes.json();
          const listEntryId = checkJson?.data?.Media?.mediaListEntry?.id;

          if (listEntryId) {
            await fetch('https://graphql.anilist.co', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              },
              body: JSON.stringify({
                query: `mutation ($id: Int) { DeleteMediaListEntry(id: $id) { deleted } }`,
                variables: { id: listEntryId }
              })
            });
          }
        } catch (err) {
          console.warn('Could not delete from AniList:', err);
        }
      }
    }

    /* Sync pulls latest from AniList and merges */
    async function syncWithAniList() {
      const token = localStorage.getItem('anicool_anilist_token');
      let user = null;
      try {
        user = JSON.parse(localStorage.getItem('anicool_anilist_user') || 'null');
      } catch (e) {}

      if (!token || !user) {
        loginWithAniList();
        return;
      }

      const syncBtn = document.getElementById('syncBtn');
      if (syncBtn) {
        syncBtn.innerHTML = `<span class="material-symbols-outlined" style="font-size:18px; animation: spin 1s infinite linear;">sync</span><span>Syncing...</span>`;
      }

      const query = `
        query ($userId: Int) {
          anime: MediaListCollection(userId: $userId, type: ANIME) {
            lists {
              entries {
                status
                score(format: POINT_100)
                media {
                  id
                  type
                  format
                  isAdult
                  genres
                  countryOfOrigin
                  episodes
                  title { english romaji native }
                  coverImage { large }
                }
              }
            }
          }
          manga: MediaListCollection(userId: $userId, type: MANGA) {
            lists {
              entries {
                status
                score(format: POINT_100)
                media {
                  id
                  type
                  format
                  isAdult
                  genres
                  countryOfOrigin
                  chapters
                  title { english romaji native }
                  coverImage { large }
                }
              }
            }
          }
        }
      `;

      try {
        const res = await fetch('https://graphql.anilist.co', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ query, variables: { userId: user.id } })
        });

        const json = await res.json();
        if (json.errors) throw new Error(json.errors[0]?.message || 'Sync failed');

        const currentData = getStoredData();
        const statusMap = {
          CURRENT: 'watching',
          PLANNING: 'planning',
          COMPLETED: 'completed',
          DROPPED: 'dropped',
          PAUSED: 'on_hold',
          REPEATING: 'watching'
        };

        let count = 0;
        const processLists = (collection) => {
          (collection?.lists || []).forEach(list => {
            (list.entries || []).forEach(entry => {
              const m = entry.media;
              if (!m) return;

              currentData[m.id] = {
                id: m.id,
                title: m.title?.english || m.title?.romaji || 'Unknown Title',
                image: m.coverImage?.large || '',
                type: m.type || 'ANIME',
                format: m.format || m.type,
                isAdult: Boolean(m.isAdult),
                genres: m.genres || [],
                countryOfOrigin: m.countryOfOrigin || '',
                episodes: m.episodes || m.chapters || '?',
                score: entry.score || null,
                status: statusMap[entry.status] || 'watching',
                addedAt: Date.now()
              };
              count++;
            });
          });
        };

        processLists(json.data?.anime);
        processLists(json.data?.manga);

        saveStoredData(currentData);
        updateCounters();
        renderWatchlist();
        alert(`Synced ${count} titles with AniList!`);
      } catch (err) {
        alert(`Sync error: ${err.message}`);
      } finally {
        renderAuthBar();
      }
    }

    function exportWatchlist() {
      const data = getStoredData();
      if (Object.keys(data).length === 0) {
        alert('Your watchlist is empty. Add some titles before exporting.');
        return;
      }
      const jsonStr = JSON.stringify(data, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `anicool_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importWatchlist(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (typeof imported !== 'object' || imported === null) throw new Error();

          const current = getStoredData();
          const merged = { ...current, ...imported };
          saveStoredData(merged);
          updateCounters();
          renderWatchlist();
          alert('Watchlist successfully imported!');
        } catch (err) {
          alert('Invalid backup file. Please select a valid AniCool JSON backup.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function renderWatchlist() {
      const grid = document.getElementById('watchlistGrid');
      const data = getStoredData();
      let items = Object.values(data);

      // 1. Status Filter
      if (activeStatus !== 'ALL') {
        if (activeStatus === 'completed') {
          items = items.filter(i => i.status === 'completed' || i.status === 'favorites');
        } else {
          items = items.filter(i => i.status === activeStatus);
        }
      }

      // 2. Strict Medium Filter
      if (activeMedium !== 'ALL') {
        items = items.filter(i => {
          const format = (i.format || '').toUpperCase();
          const type = (i.type || '').toUpperCase();
          const isAdult = Boolean(i.isAdult) || (Array.isArray(i.genres) && i.genres.includes('Hentai'));
          const isManhwa = format === 'MANHWA' || i.countryOfOrigin === 'KR';

          if (activeMedium === 'HENTAI') return isAdult && type === 'ANIME';
          if (activeMedium === 'READ_HENTAI') return isAdult && type === 'MANGA';
          if (activeMedium === 'MANHWA') return isManhwa && !isAdult;
          if (activeMedium === 'MANGA') return type === 'MANGA' && !isAdult && !isManhwa;
          if (activeMedium === 'ANIME') return type === 'ANIME' && !isAdult;
          return true;
        });
      }

      // 3. Search Filter
      if (searchKeyword) {
        items = items.filter(i => (i.title || '').toLowerCase().includes(searchKeyword));
      }

      items.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));

      if (items.length === 0) {
        grid.innerHTML = `
          <div class="empty-box">
            <div class="empty-box-icon">
              <span class="material-symbols-outlined">bookmarks</span>
            </div>
            <h3>No Titles Found</h3>
            <p>No saved titles match your current filters or search term.</p>
            <a href="index.html" class="browse-link-btn">Explore Titles</a>
          </div>
        `;
        return;
      }

      const statusBadgeText = {
        watching: 'Watching',
        planning: 'Planning',
        on_hold: 'On Hold',
        completed: 'Completed',
        dropped: 'Dropped',
        favorites: 'Favorite'
      };

      grid.innerHTML = items.map(item => {
        const title = item.title || 'Untitled';
        const cover = item.image || 'favicon.png';
        const format = item.format || 'ANIME';
        const score = item.score ? `★ ${item.score}%` : '';
        const count = item.episodes ? `${item.episodes} Ep` : '';
        const currentStatus = item.status || 'watching';
        const displayStatus = statusBadgeText[currentStatus] || 'Saved';

        return `
          <div class="card-wrap">
            <div class="card-hover-controls">
              <button type="button" class="ctrl-icon-btn danger-btn" onclick="deleteItem(${item.id}, '${escapeQuotes(title)}', event)" title="Delete from Library">
                <span class="material-symbols-outlined">delete</span>
              </button>
            </div>

            <a href="entry.html?id=${item.id}" class="anime-card">
              <div class="card-thumb-wrap">
                <img src="${cover}" alt="${title}" class="card-thumb" loading="lazy" />
                ${score ? `<div class="card-badge-top">${score}</div>` : ''}
                <div class="card-format-tag">${displayStatus}</div>
              </div>
              <div class="card-info">
                <h3 class="card-item-title" title="${title}">${title}</h3>
                <div class="card-item-sub">
                  <span>${format}</span>
                  ${count ? `<span>${count}</span>` : ''}
                </div>
              </div>
            </a>
          </div>
        `;
      }).join('');
    }

    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderAuthBar();
      updateCounters();
      renderWatchlist();
    });
  </script>
